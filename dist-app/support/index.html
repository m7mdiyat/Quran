<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>الدعم والملاحظات | محمديات</title>
  <meta name="description" content="أرسل ملاحظتك أو بلاغك لمنصة محمديات — رأيك يصلنا مباشرة." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://m7mdiyat.com/support" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#f7fbff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#232933" media="(prefers-color-scheme: dark)" />

  <!-- Match the app: dark mode is driven by the same localStorage flag the
       main site uses. Applied before paint to avoid a flash. -->
  <script>
    try { if (localStorage.getItem("darkMode") === "1") document.documentElement.classList.add("dark"); } catch (e) { }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" />

  <style>
    /* ── Design tokens (verbatim from the site) ──────────────────────── */
    :root {
      --card: rgba(247, 251, 255, .96);
      --line: rgba(15, 23, 42, .10);
      --text: #0b1326;
      --muted: rgba(15, 23, 42, .62);
      --accent: #1d8fff;
    }
    html.dark {
      --card: rgba(35, 41, 51, .98);
      --line: rgba(148, 163, 184, .18);
      --text: #e5e7eb;
      --muted: rgba(203, 213, 225, .7);
      --accent: #60a5fa;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { margin: 0; }

    body {
      font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background-color: #eff5ff;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }
    html.dark body { background-color: #232933; }

    /* Static, never-repainting background layer — same gradients as the site. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(1400px 900px at 50% -20%, rgba(191, 219, 254, .35), transparent 65%),
        radial-gradient(1200px 780px at 0% 110%, rgba(186, 230, 253, .28), transparent 60%),
        radial-gradient(1200px 780px at 100% 120%, rgba(165, 243, 252, .24), transparent 60%),
        linear-gradient(180deg, #f7fbff 0%, #eff5ff 55%, #edf6fb 100%);
    }
    html.dark body::before {
      background:
        radial-gradient(1300px 820px at 50% -30%, rgba(148, 163, 184, .16), transparent 65%),
        radial-gradient(1100px 720px at 0% 120%, rgba(148, 163, 184, .18), transparent 60%),
        radial-gradient(1100px 720px at 100% 120%, rgba(148, 163, 184, .12), transparent 60%),
        linear-gradient(180deg, #232933 0%, #1f252e 55%, #1b2129 100%);
    }

    /* ── Minimal top bar (wordmark + theme toggle), like the site ─────── */
    .bar {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.5px;
      color: var(--text);
      text-decoration: none;
    }

    .theme-toggle {
      padding: 8px 16px;
      border-radius: 16px;
      border: 1px solid rgba(15, 23, 42, .12);
      background: linear-gradient(135deg, #ffffff, #f8fafc);
      color: #334155;
      font-family: inherit;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: .3px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
      transition: all .3s cubic-bezier(.4, 0, .2, 1);
    }
    @media (hover: hover) {
      .theme-toggle:hover {
        background: linear-gradient(135deg, #1e293b, #334155);
        border-color: rgba(15, 23, 42, .2);
        color: #f1f5f9;
        transform: translateY(-1px);
      }
    }
    html.dark .theme-toggle {
      background: linear-gradient(135deg, #232933, #1f252e);
      border-color: rgba(148, 163, 184, .2);
      color: #e2e8f0;
    }
    @media (hover: hover) {
      html.dark .theme-toggle:hover {
        background: linear-gradient(135deg, #ffffff, #f1f5f9);
        border-color: rgba(148, 163, 184, .3);
        color: #1e293b;
        transform: translateY(-1px);
      }
    }

    /* ── Layout: the support card centered ────────────────────────────── */
    main {
      flex: 1;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 8px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── Card (the app's feedback sheet, as a standalone card) ────────── */
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 26px 22px 20px;
      box-shadow: 0 30px 80px rgba(15, 23, 42, .14);
    }
    html.dark .card { box-shadow: 0 30px 80px rgba(0, 0, 0, .4); }

    .head { text-align: center; margin-bottom: 18px; }
    .icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 12px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(29, 143, 255, .15), rgba(29, 143, 255, .05));
      color: #1d8fff;
    }
    html.dark .icon {
      background: linear-gradient(135deg, rgba(96, 165, 250, .18), rgba(96, 165, 250, .05));
      color: #60a5fa;
    }
    .icon svg { width: 28px; height: 28px; }
    .title { margin: 0; font-size: 19px; font-weight: 700; color: var(--text); }
    .desc { margin: 7px 0 0; font-size: 13.5px; font-weight: 500; color: var(--muted); line-height: 1.7; }

    /* ── Form (verbatim feedback-form styling from the site) ──────────── */
    .feedback-form { display: flex; flex-direction: column; gap: 12px; margin: 0; }
    .feedback-field { display: flex; flex-direction: column; gap: 6px; position: relative; }
    .feedback-label { font-size: 12px; font-weight: 600; color: #475569; }
    html.dark .feedback-label { color: #cbd5e1; }
    .feedback-optional { color: #94a3b8; font-weight: 500; }
    html.dark .feedback-optional { color: #64748b; }

    .feedback-input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid rgba(15, 23, 42, .12);
      background: #ffffff;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }
    .feedback-input:focus { border-color: #1d8fff; box-shadow: 0 0 0 3px rgba(29, 143, 255, .15); }
    html.dark .feedback-input { background: rgba(15, 23, 42, .35); color: #e2e8f0; border-color: rgba(148, 163, 184, .25); }
    html.dark .feedback-input:focus { border-color: #60a5fa; box-shadow: 0 0 0 3px rgba(96, 165, 250, .2); }

    .feedback-textarea { resize: vertical; min-height: 110px; max-height: 260px; line-height: 1.6; }

    .feedback-counter { align-self: flex-start; font-size: 11px; color: #94a3b8; font-variant-numeric: tabular-nums; }
    html.dark .feedback-counter { color: #64748b; }

    .feedback-honeypot {
      position: absolute; left: -9999px; top: -9999px;
      width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none;
    }

    /* Submit button (offline-btn--primary). */
    .submit-btn {
      width: 100%;
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid transparent;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      background: linear-gradient(135deg, #1d8fff, #1976d2);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(29, 143, 255, .26);
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    }
    @media (hover: hover) {
      .submit-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(29, 143, 255, .32); }
    }
    .submit-btn:disabled { opacity: .65; cursor: default; transform: none; box-shadow: 0 4px 10px rgba(29, 143, 255, .18); }

    .feedback-status {
      min-height: 0; font-size: 13px; font-weight: 600; text-align: center;
      padding: 0; border-radius: 12px; transition: padding 120ms ease;
    }
    .feedback-status:empty { display: none; }
    .feedback-status--info { padding: 9px 10px; background: rgba(29, 143, 255, .08); color: #1976d2; }
    .feedback-status--ok { padding: 9px 10px; background: rgba(34, 197, 94, .12); color: #15803d; }
    .feedback-status--err { padding: 9px 10px; background: rgba(239, 68, 68, .12); color: #b91c1c; }
    html.dark .feedback-status--info { background: rgba(96, 165, 250, .14); color: #bfdbfe; }
    html.dark .feedback-status--ok { background: rgba(34, 197, 94, .18); color: #bbf7d0; }
    html.dark .feedback-status--err { background: rgba(239, 68, 68, .2); color: #fecaca; }

    .back {
      margin-top: 18px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
    }
    @media (hover: hover) { .back:hover { color: var(--accent); } }
  </style>
</head>

<body>
  <header class="bar">
    <a class="brand" href="/">محمديات</a>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="تبديل الوضع">داكن</button>
  </header>

  <main>
    <div class="card">
      <div class="head">
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z" />
          </svg>
        </div>
        <h1 class="title">إرسال ملاحظة</h1>
        <p class="desc">رأيك أو بلاغك يصلني مباشرة.</p>
      </div>

      <form class="feedback-form" novalidate>
        <label class="feedback-field">
          <span class="feedback-label">نوع الملاحظة</span>
          <select class="feedback-input" name="category">
            <option value="suggestion" selected>اقتراح</option>
            <option value="bug">خطأ / مشكلة</option>
            <option value="other">أخرى</option>
          </select>
        </label>

        <label class="feedback-field">
          <span class="feedback-label">رسالتك</span>
          <textarea class="feedback-input feedback-textarea" name="message" rows="5" maxlength="5000"
            placeholder="اكتب ملاحظتك هنا..." required></textarea>
          <span class="feedback-counter" aria-live="polite">0 / 5000</span>
        </label>

        <label class="feedback-field">
          <span class="feedback-label">البريد الإلكتروني <span class="feedback-optional">(اختياري)</span></span>
          <input class="feedback-input" type="email" name="email" autocomplete="email"
            placeholder="ضع ايميلك هنا..." />
        </label>

        <div class="feedback-honeypot" aria-hidden="true">
          <label>Website</label>
          <input type="text" name="website" tabindex="-1" autocomplete="off" />
        </div>

        <button type="submit" class="submit-btn">إرسال</button>
        <div class="feedback-status" role="status" aria-live="polite"></div>
      </form>
    </div>

    <a class="back" href="/">العودة إلى الصفحة الرئيسية</a>
  </main>

  <script>
    (function () {
      "use strict";
      var FEEDBACK_URL = "https://tafsir-api-317751773286.me-central1.run.app/feedback";
      var MAX = 5000;

      /* ── Theme toggle — same localStorage flag as the main site ─────── */
      var root = document.documentElement;
      var themeBtn = document.getElementById("themeToggle");
      function syncThemeLabel() {
        themeBtn.textContent = root.classList.contains("dark") ? "فاتح" : "داكن";
      }
      syncThemeLabel();
      themeBtn.addEventListener("click", function () {
        var dark = !root.classList.contains("dark");
        root.classList.toggle("dark", dark);
        try { localStorage.setItem("darkMode", dark ? "1" : "0"); } catch (e) { }
        syncThemeLabel();
      });

      /* ── Feedback form ──────────────────────────────────────────────── */
      var form = document.querySelector(".feedback-form");
      var ta = form.querySelector("textarea[name=message]");
      var counter = form.querySelector(".feedback-counter");
      var statusEl = form.querySelector(".feedback-status");
      var btn = form.querySelector(".submit-btn");
      var submitting = false;

      function updateCounter() { counter.textContent = ta.value.length + " / " + MAX; }
      ta.addEventListener("input", updateCounter);
      updateCounter();

      function setStatus(kind, msg) {
        statusEl.className = "feedback-status" + (kind ? " feedback-status--" + kind : "");
        statusEl.textContent = msg || "";
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (submitting) return;

        var message = (ta.value || "").trim();
        var category = (form.querySelector("select[name=category]") || {}).value || "other";
        var email = (form.querySelector("input[name=email]").value || "").trim();
        var hp = form.querySelector("input[name=website]").value || "";

        if (!message) { setStatus("err", "اكتب رسالتك أولًا"); ta.focus(); return; }

        submitting = true;
        btn.disabled = true;
        var orig = btn.textContent;
        btn.textContent = "جارٍ الإرسال...";
        setStatus("info", "جارٍ الإرسال...");

        fetch(FEEDBACK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ category: category, message: message, email: email, source: "web", hp: hp })
        }).then(function (res) {
          return res.json().catch(function () { return null; }).then(function (data) {
            return { res: res, data: data };
          });
        }).then(function (out) {
          if (out.res.ok && out.data && out.data.ok === true) {
            form.reset();
            updateCounter();
            setStatus("ok", "تم إرسال رسالتك، شكرًا لك");
          } else if (out.res.status === 429) {
            setStatus("err", "حاول مرة أخرى بعد قليل");
          } else {
            setStatus("err", "تعذّر الإرسال، حاول مرة أخرى");
          }
        }).catch(function () {
          setStatus("err", "تعذّر الإرسال، حاول مرة أخرى");
        }).then(function () {
          submitting = false;
          btn.disabled = false;
          btn.textContent = orig;
        });
      });
    })();
  </script>
</body>

</html>
