  <!-- Google Analytics (gtag.js) — WEBSITE ONLY. Skipped entirely inside the
       Capacitor app via the same inApp check used for html.is-app (works at
       head-time, before window.Capacitor exists: covers iOS capacitor://,
       Android localhost, and window.Capacitor). In the app no analytics script
       is fetched and no tracking request fires; the website (m7mdiyat.com)
       loads and uses GA exactly as before. (scripts/build-app.js also strips
       this block from the app bundle so the GA id isn't even present there.) -->
  <script>
    (function () {
      try {
        var loc = window.location;
        var inApp = (typeof window.Capacitor !== "undefined")
          || (loc.protocol === "capacitor:")
          || (loc.hostname === "localhost" && loc.port === ""
              && navigator.userAgent.indexOf("Android") !== -1);
        if (inApp) return; // app → no analytics, no third-party request
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag('js', new Date());
        gtag('config', 'G-GDBDK944QZ');
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-GDBDK944QZ';
        document.head.appendChild(s);
      } catch (e) { }
    })();
  </script>

  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script>
    (function () {
      try {
        if (localStorage.getItem("darkMode") === "1") {
          document.documentElement.classList.add("dark");
        }
      } catch { }
    })();
    // Detect Capacitor (Android app) context synchronously so safe-area CSS
    // gated to html.is-app applies before first paint, AND so viewport-fit=cover
    // is only set inside the app (web layout — including iOS Safari with a
    // notch — must remain visually unchanged).
    //
    // window.Capacitor is injected by the native bridge AFTER scripts evaluate,
    // so we fall back to the URL: the Capacitor WebView serves from
    // capacitor://localhost or https://localhost (NO port) and the user agent
    // contains "Android". The Vite dev server also uses http://localhost but
    // with an explicit port (5173/5174/…), so the port check excludes it; the
    // production site origin is m7mdiyat.com, which never matches. Mirrors
    // isApp() in src/app.js so the inline-script gate stays consistent with
    // the runtime gate.
    (function () {
      try {
        var loc = window.location;
        var inApp = (typeof window.Capacitor !== "undefined")
          || (loc.protocol === "capacitor:")
          || (loc.hostname === "localhost"
              && loc.port === ""
              && navigator.userAgent.indexOf("Android") !== -1);
        if (!inApp) return;
        document.documentElement.classList.add("is-app");
        // App: lock the viewport so the WebView feels native — kill double-tap
        // zoom AND pinch-zoom (maximum-scale=1 + user-scalable=no) while keeping
        // the edge-to-edge safe-area layout (viewport-fit=cover). Runs only
        // inside the app, so the website keeps its fully zoomable viewport
        // (accessibility pinch-zoom on the web is untouched). The Mushaf's own
        // zoom is a CSS transform, not browser zoom, so it still works.
        var meta = document.querySelector('meta[name="viewport"]');
        if (meta) {
          meta.setAttribute("content",
            "width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover");
        }
        // Apply previously-measured Android status-bar height (set by JS
        // via StatusBar.getInfo() on a previous launch) so the very first
        // paint already pads correctly — no layout shift when the async
        // re-measurement finishes. First-ever launch still falls back to
        // the CSS 24px floor for one frame, then jumps to the real value.
        try {
          var cached = localStorage.getItem("m7_statusbar_h");
          if (cached && Number(cached) > 0) {
            document.documentElement.style.setProperty("--m7-statusbar-height", cached + "px");
          }
        } catch {}
      } catch { }
    })();
  </script>

  <link id="canonicalLink" rel="canonical" href="https://www.m7mdiyat.com/" />
  <meta id="ogUrl" property="og:url" content="https://www.m7mdiyat.com/" />
  <meta id="ogTitle" property="og:title" content="محمديات" />

  <script>
    (function () {
      try {
        var url = new URL(window.location.href);
        var params = new URLSearchParams(url.search);
        var cleanOrigin = "https://www.m7mdiyat.com";
        var surah = null, ayah = null;

        // Pattern 1: New clean URL format /surah/ayah
        var pathMatch = url.pathname.match(/^\/([0-9]+)\/([0-9]+)\/?$/);
        if (pathMatch) {
          surah = pathMatch[1];
          ayah = pathMatch[2];
        }

        // Pattern 1b: Mushaf reading-mode routes (direct or via 404.html →
        // sessionStorage handoff on GitHub Pages). We don't change layout
        // here — mushaf.js opens the panel inline once app.js init runs.
        // We only set window._mushafInit so init() knows what to open.
        var mushafPath = url.pathname;
        try {
          var redirected = sessionStorage.getItem('mushaf_redirect');
          if (redirected) {
            sessionStorage.removeItem('mushaf_redirect');
            mushafPath = redirected;
            history.replaceState(null, "", mushafPath);
          }
        } catch {}

        var mushafPageMatch = mushafPath.match(/^\/read\/page\/([0-9]+)\/?$/);
        var mushafSurahMatch = mushafPath.match(/^\/read\/surah\/([0-9]+)\/?$/);
        var mushafAyahMatch = mushafPath.match(/^\/read\/ayah\/([0-9]+)\/([0-9]+)\/?$/);
        if (mushafPageMatch) window._mushafInit = { page: Number(mushafPageMatch[1]) };
        else if (mushafSurahMatch) window._mushafInit = { surah: Number(mushafSurahMatch[1]) };
        else if (mushafAyahMatch) window._mushafInit = { surah: Number(mushafAyahMatch[1]), ayah: Number(mushafAyahMatch[2]) };

        // The mode toggle's visual state must match what's about to render.
        // URL is canonical: /read/* → Mushaf, anything else → Tafsir. Setting
        // this BEFORE the modules load avoids a brief flash where the toggle
        // shows the saved preference and then snaps to the URL-driven mode.
        var bootMushaf = !!(mushafPageMatch || mushafSurahMatch || mushafAyahMatch);
        var bootMode = bootMushaf ? "mushaf" : "tafsir";
        document.documentElement.setAttribute("data-app-mode", bootMode);
        try { localStorage.setItem("app_mode", bootMode); } catch {}

        // Pattern 2: Old query format ?v=surah-ayah (redirect to new format)
        var v = params.get("v") || params.get("ayah");
        if (!surah && v) {
          var parts = v.split(/[-:\/]/);
          if (parts.length >= 2) {
            surah = parts[0];
            ayah = parts[1];
            // Redirect old URL to new clean URL
            window.location.replace("/" + surah + "/" + ayah);
            return;
          }
        }

        // Pattern 3: Check sessionStorage for 404 redirect
        var redirSurah = sessionStorage.getItem('redirect_surah');
        var redirAyah = sessionStorage.getItem('redirect_ayah');
        if (!surah && redirSurah && redirAyah) {
          surah = redirSurah;
          ayah = redirAyah;
          sessionStorage.removeItem('redirect_surah');
          sessionStorage.removeItem('redirect_ayah');
          // Store in app state for later use
          window._redirectedAyah = { surah: surah, ayah: ayah };
        }

        // Build final canonical URL
        var finalUrl = cleanOrigin + "/";
        var pageTitle = "محمديات";

        if (surah && ayah) {
          finalUrl = cleanOrigin + "/" + surah + "/" + ayah;
          pageTitle = "تفسير سورة " + surah + " آية " + ayah + " | محمديات";
        }

        // Apply to canonical (most important for SEO)
        var link = document.getElementById("canonicalLink");
        if (link) link.href = finalUrl;

        // Apply to Open Graph
        var ogUrl = document.getElementById("ogUrl");
        if (ogUrl) ogUrl.content = finalUrl;
        var ogTitle = document.getElementById("ogTitle");
        if (ogTitle) ogTitle.content = pageTitle;

        // Apply to browser tab only if not already set by prerender
        if (document.title === "محمديات") {
          document.title = pageTitle;
        }

      } catch (e) { console.error("SEO Patch Error", e); }
    })();
  </script>

  <style>
    @font-face {
      font-family: "MeQuran";
      src: url("/MeQuran.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --card: rgba(255, 255, 255, .82);
      --card2: rgba(255, 255, 255, .64);
      --line: rgba(15, 23, 42, .10);
      --text: #0b1326;
      --muted: rgba(15, 23, 42, .62);
      --accent: #1d8fff;
      --accent-strong: #0b6bdc;
      --accent-soft: rgba(14, 165, 233, .14);
      --accent-muted: rgba(56, 189, 248, .18);
    }

    body.dark,
    html.dark body {
      --card: rgba(40, 46, 54, .92);
      --card2: rgba(34, 40, 48, .82);
      --line: rgba(148, 163, 184, .22);
      --text: #e5e7eb;
      --muted: rgba(203, 213, 225, .7);
      --accent: #a0a7b4;
      --accent-strong: #cbd5e1;
      --accent-soft: rgba(148, 163, 184, .20);
      --accent-muted: rgba(148, 163, 184, .22);
      background:
        radial-gradient(1300px 820px at 50% -30%, rgba(148, 163, 184, .16), transparent 65%),
        radial-gradient(1100px 720px at 0% 120%, rgba(148, 163, 184, .18), transparent 60%),
        radial-gradient(1100px 720px at 100% 120%, rgba(148, 163, 184, .12), transparent 60%),
        linear-gradient(180deg, #232933 0%, #1f252e 55%, #1b2129 100%);
      background-attachment: fixed;
    }

    body.dark .glass,
    html.dark .glass {
      box-shadow: 0 12px 36px rgba(0, 0, 0, .35);
    }

    body.dark header,
    html.dark header {
      background: rgba(24, 28, 34, .9) !important;
      border-color: rgba(148, 163, 184, .22) !important;
    }

    /* body must NOT get height:100%: a fixed-height body caps the sticky
     * header's containing block at one viewport, so the header slid up
     * off-screen ("swallowed") as soon as the page scrolled past 100vh.
     * The body rule below keeps min-height:100vh, so the box still covers
     * the viewport but now grows with the content — the sticky header
     * stays pinned for the entire scroll. */
    html {
      height: 100%;
    }

    html,
    body {
      margin: 0;
    }

    /* The root element must be painted: on iOS the rubber-band/overscroll
     * area shows the html background (the body gradient does NOT propagate
     * past it) — unpainted, the WebView's own white leaks through on hard
     * scrolls. Bottom overscroll is by far the common case, so the canvas
     * matches the page gradient's BOTTOM stop exactly (#edf6fb light /
     * #1b2129 dark — see body::before) — the seam disappears. The
     * fullscreen Mushaf variant matches its own surface (class set by
     * page-fullscreen.js). */
    html {
      background-color: #edf6fb;
    }

    html.dark {
      background-color: #1b2129;
    }

    html.mushaf-fs-open {
      background-color: #ffffff;
    }

    html.dark.mushaf-fs-open {
      background-color: #232933;
    }

    /* App only: no rubber-band bounce on the page scroller — the bounce
     * dragged the sticky header (the whole top area) off-screen during
     * hard scrolls, and exposed the overscroll area behind the page. */
    html.is-app,
    html.is-app body {
      overscroll-behavior-y: none;
    }

    body {
      font-family: "Outfit", system-ui, -apple-system, "Segoe UI", Arial;
      color: var(--text);
      /* Performance Fix: Remove fixed background from body directly */
      background-color: #eff5ff;
      min-height: 100vh;
      position: relative;
      overflow-anchor: none;
    }

    /* Create a static background layer that never needs repainting */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(1400px 900px at 50% -20%, rgba(191, 219, 254, .35), transparent 65%),
        radial-gradient(1200px 780px at 0% 110%, rgba(186, 230, 253, .28), transparent 60%),
        radial-gradient(1200px 780px at 100% 120%, rgba(165, 243, 252, .24), transparent 60%),
        linear-gradient(180deg, #f7fbff 0%, #eff5ff 55%, #edf6fb 100%);
    }

    /* Dark mode override for the pseudo-element */
    body.dark::before {
      background:
        radial-gradient(1300px 820px at 50% -30%, rgba(148, 163, 184, .16), transparent 65%),
        radial-gradient(1100px 720px at 0% 120%, rgba(148, 163, 184, .18), transparent 60%),
        radial-gradient(1100px 720px at 100% 120%, rgba(148, 163, 184, .12), transparent 60%),
        linear-gradient(180deg, #232933 0%, #1f252e 55%, #1b2129 100%);
    }

    header.site-header {
      background: rgba(247, 251, 255, .72);
      border-color: var(--line);
      backdrop-filter: blur(8px);
    }

    /* Capacitor app only: status bar / notch / cutout safe-area padding.
     * Under Android 15+ (target SDK 35+) the WebView is forced edge-to-edge
     * and overlaysWebView:true makes that consistent on older Android too,
     * so the sticky header must pad its own top + left/right insets — the
     * system no longer reserves the space. Gated to html.is-app (set by
     * the inline script above) so web layout is byte-identical.
     *
     * For the TOP inset we use max(env(...), 24px). Reason: on Android 14
     * with overlaysWebView:true the WebView genuinely renders edge-to-edge,
     * but the Android 14 WebView's window-insets propagation to the
     * renderer is unreliable — env(safe-area-inset-top) often reports 0
     * instead of the real ~30dp status-bar height. With a 0-padding header,
     * the buttons render BEHIND the status bar overlay (the "top eaten up"
     * symptom on Pixel 8). 24px is the Android default status-bar height,
     * so max() guarantees at least that much padding even when env() lies.
     * Android 15+ propagates correctly (env returns ~30+) → max picks env,
     * unchanged behavior. */
    html.is-app header.site-header {
      padding-top: max(env(safe-area-inset-top, 0px), var(--m7-statusbar-height, 24px));
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      /* App: solid page background instead of the translucent wash. The
         header pads down behind the status bar, and rgba(247,251,255,.72)
         over the page composites to #f5f9ff — a desaturated band that reads
         as a grey strip against the page, which renders flat #eff5ff in the
         app (body's own background paints over the z:-1 ::before gradient,
         so the #f7fbff top stop never shows). Solid #eff5ff = strip is
         pixel-identical to the page. Dark override below. Website keeps its
         translucent glass header — this is is-app only. */
      background: #eff5ff;
      backdrop-filter: none;
    }

    /* App + dark theme: same fix as above — solid dark page color (#232933,
       the dark gradient's top stop; measured page under the header renders
       #242a34±2). !important to outrank the body.dark header rule above. */
    html.is-app body.dark header.site-header,
    html.dark.is-app header.site-header {
      background: #232933 !important;
    }

    /* App: nudge the wordmark + tagline block up a touch — the hero's
       pt-14 (56px) under the tall safe-area header left it sitting low.
       Fixed small reduction only; no centering, no layout change. */
    html.is-app main > section:first-of-type {
      padding-top: 24px;
    }

    .theme-toggle {
      /* White button in light mode */
      background: linear-gradient(135deg, #ffffff, #f8fafc);
      border-color: rgba(15, 23, 42, .12);
      color: #334155;
      letter-spacing: .3px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* The theme toggle is WEB-ONLY now: in the app, dark/light lives in the
       Settings sheet, so the top-bar button is hidden there. The inline head
       script sets html.is-app synchronously before first paint (no flash). On
       the website (no is-app) it stays — keeping theme switching reachable
       without an app-only Settings panel. */
    html.is-app #themeToggle { display: none; }

    /* Hover styles are the visual INVERSE of the normal styles (dark in
     * light mode, light in dark mode). On touch devices :hover sticks
     * after a tap until the next touch elsewhere, so the post-tap button
     * froze in this inverse state — looking exactly like the previous
     * mode and creating the "one tap behind" perception. Gating hover
     * to @media (hover: hover) ensures only true pointer devices (mouse,
     * trackpad) get hover effects; touch never sticks. Same pattern is
     * used elsewhere in public/styles.css:879-907. */
    @media (hover: hover) {
      .theme-toggle:hover {
        /* Dark on hover in light mode */
        background: linear-gradient(135deg, #1e293b, #334155);
        border-color: rgba(15, 23, 42, .2);
        color: #f1f5f9;
        transform: translateY(-1px);
      }
    }

    body.dark .theme-toggle {
      /* Dark button matching page background in dark mode */
      background: linear-gradient(135deg, #232933, #1f252e) !important;
      border-color: rgba(148, 163, 184, .2) !important;
      color: #e2e8f0 !important;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    @media (hover: hover) {
      body.dark .theme-toggle:hover {
        /* Light on hover in dark mode */
        background: linear-gradient(135deg, #ffffff, #f1f5f9) !important;
        border-color: rgba(148, 163, 184, .3) !important;
        color: #1e293b !important;
        transform: translateY(-1px);
      }
    }

    .quran-font {
      font-family: "Amiri", serif;
    }

    /* Smooth, iOS-like feel */
    * {
      -webkit-tap-highlight-color: transparent;
    }

    /* Global Smoothness: Force pointer cursor on all interactive elements */
    button,
    select,
    a,
    [role="button"],
    .cursor-pointer {
      cursor: pointer !important;
    }

    /* Optional: Add a tiny smooth lift to all buttons on hover for extra polish */
    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    /* Reset cursor for disabled buttons */
    button:disabled {
      cursor: not-allowed !important;
      transform: none !important;
    }

    .glass {
      background: linear-gradient(180deg, var(--card), var(--card2));
      border: 1px solid var(--line);
      box-shadow: 0 12px 32px rgba(15, 23, 42, .10);
      backdrop-filter: blur(8px);
    }

    .subtle {
      box-shadow: 0 8px 20px rgba(15, 23, 42, .08);
    }

    /* AI panel accordion */
    #aiPanel {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(-4px);
      transition: max-height .45s ease, opacity .35s ease, transform .35s ease;
    }

    #aiPanel.is-open {
      max-height: 4000px;
      opacity: 1;
      transform: translateY(0);
      overflow: visible;
    }

    /* Results collapse chip behavior (keeps compatibility with app.js) */
    .results {
      transition: max-height .35s ease, opacity .25s ease, transform .25s ease,
        padding .3s ease, margin-top .3s ease, border-width .3s ease;
    }

    /* ISSUE 1: collapsing only max-height left a 26px residue strip (the
       list's 12px paddings + 1px borders) plus the shell/list margins —
       after picking an ayah the card sat 38px taller than the landing
       state (which is flat only because is-empty adds display:none).
       Collapse EVERYTHING so the post-pick card is pixel-identical to the
       initial compact card; the transitions above ease it shut/open. */
    .results.collapsed {
      max-height: 0 !important;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-2px) scale(.99);
      padding-top: 0;
      padding-bottom: 0;
      border-width: 0;
      margin-top: 0;
    }

    .results-shell.is-empty {
      margin-top: 0;
      display: none;
    }

    /* ── مسح in the pill (replaces the selected-ayah chip card) ─────────
       Sits in the action cluster on the surah selector's RIGHT. Hidden on
       the homepage; once an ayah is selected it slowly fades into
       existence (JS toggles is-shown — display flips first, opacity
       transitions after a staged frame). Geometry mirrors the selector
       pill so the cluster reads as one control group, and the cluster's
       ResizeObserver automatically widens the input padding + the
       text-fade mask to clear it. */
    .pill-clear-btn {
      display: none;
      box-sizing: border-box;
      height: 28px;
      /* Icon-only (rewind-to-start): a compact pill that mirrors the
         selector's geometry — fixed width instead of text padding. */
      width: 34px;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      border-radius: 12px;
      /* Same skin as the surah selector beside it (the in-pill
         .mushaf-surah-select variant) — one control group, one material. */
      background: rgba(15, 23, 42, .05);
      color: var(--text);
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: background 150ms ease;
      will-change: transform, opacity, filter;
    }

    .pill-clear-btn svg {
      width: 15px;
      height: 15px;
      display: block;
      /* keeps the stroke from clipping while it draws */
      overflow: visible;
    }

    .pill-clear-btn.is-shown {
      display: inline-flex;
    }

    .pill-clear-btn.is-visible {
      opacity: 1;
    }

    /* Success-check entrance, HORIZONTAL cut: fade + rotate + blur (the
       shared Task-6 keyframes/vars) + an X-bob that slides the pill in
       from the LEFT — the bob ease's slight overshoot lands it with a
       spring — while the rewind stroke draws itself (JS arms the
       dasharray from the real path lengths). */
    .pill-clear-btn.is-entering {
      animation:
        t-check-fade var(--check-opacity-dur) var(--check-ease-opacity) forwards,
        t-check-rotate var(--check-rotate-dur) var(--check-ease-rotate) forwards,
        t-check-blur var(--check-blur-dur) var(--check-ease-out) forwards,
        pill-clear-bob-x var(--check-bob-dur) var(--check-ease-bob) forwards;
    }

    .pill-clear-btn.is-entering svg path {
      animation: t-check-draw var(--check-path-dur) var(--check-ease-path) var(--check-path-delay, 0ms) forwards;
    }

    @keyframes pill-clear-bob-x {
      from {
        translate: -40px 0;
      }

      to {
        translate: 0 0;
      }
    }

    /* Exit continues the same journey: off to the RIGHT, fading. */
    .pill-clear-btn.is-leaving {
      animation: pill-clear-exit-x 320ms var(--check-ease-out) forwards;
    }

    @keyframes pill-clear-exit-x {
      from {
        translate: 0 0;
        opacity: 1;
      }

      to {
        translate: 44px 0;
        opacity: 0;
      }
    }

    .pill-clear-btn:hover {
      background: rgba(15, 23, 42, .10);
    }

    body.dark .pill-clear-btn,
    html.dark .pill-clear-btn {
      background: rgba(148, 163, 184, .12);
    }

    body.dark .pill-clear-btn:hover,
    html.dark .pill-clear-btn:hover {
      background: rgba(148, 163, 184, .18);
    }

    @media (prefers-reduced-motion: reduce) {
      .pill-clear-btn {
        transition: none !important;
        animation: none !important;
      }

      .pill-clear-btn.is-entering svg path {
        animation: none !important;
        stroke-dashoffset: 0 !important;
      }
    }

    /* ── مسح staged teardown ──────────────────────────────────────────
     * Phase 1: the open content (chip card, results, Tafsir/Mushaf panel)
     * fades out calmly. Phase 2 (JS, after the fade): state reset + jump
     * to top happen behind the blank moment, then the search panel settles
     * back in with a soft entrance. !important so the fade beats any
     * element-level transition/animation already on the targets. */
    .m7-clear-fade {
      /* The height/padding/margin legs carry the مسح SMOOTH COLLAPSE: once
         the panel has faded to transparent, finishReset (app.js) eases its
         box to zero so the content below GLIDES up instead of jumping when
         the panel is finally display:none'd. !important must list them
         here — it outranks the inline transition JS would set. */
      transition: opacity 280ms ease,
        height 240ms cubic-bezier(0.22, 1, 0.36, 1),
        padding 240ms cubic-bezier(0.22, 1, 0.36, 1),
        margin 240ms cubic-bezier(0.22, 1, 0.36, 1),
        border-width 240ms cubic-bezier(0.22, 1, 0.36, 1) !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* (.m7-home-enter is retired: replaying an entrance on the search
       panel after مسح read as a page-refresh flash — the panel never
       leaves the screen during the staged reset, so it stays put.) */

    .results.is-empty {
      border-color: transparent !important;
      background: transparent !important;
      padding: 0 !important;
    }

    /* Smooth staggered fade-in for result cards */
    @keyframes resultCardEnter {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-card-enter {
      animation: resultCardEnter 0.25s ease-out forwards;
      opacity: 0;
    }

    /* Keep scrollbar always visible to prevent layout shift */
    .results-list {
      scrollbar-gutter: stable;
    }

    .input-glass {
      background: rgba(255, 255, 255, .75);
      border: 1px solid rgba(15, 23, 42, .12);
      border-radius: 18px;
      -webkit-appearance: none;
      appearance: none;
      background-image: none;
      box-shadow: none;
    }

    /* The input's left padding must clear the #searchPillActions cluster
     * (the surah selector). The cluster's width varies — the selector is
     * injected by mushaf.js and grows with the surah name — so app.js
     * mirrors its footprint (offsetLeft + offsetWidth) into
     * --search-actions-w via a ResizeObserver. Fallback covers the brief
     * empty-cluster state before the selector lands. */
    #textSearch {
      /* 6px breathing gap after the cluster (was 12px — trimmed to fund the
       * wider selector; see the width budget on the cluster rule below). */
      padding-left: calc(var(--search-actions-w, 60px) + 6px);
    }

    /* If the placeholder ever outgrows the input (long surah names widen
     * the selector), truncate with … at the inline-end (the left in RTL) —
     * never a hard clip at the start of the sentence. */
    #textSearch::placeholder {
      text-overflow: ellipsis;
    }

    /* The input sits disabled from init until the search index finishes
     * building (src/app.js locks it). Browsers dim disabled inputs hard —
     * Android WebView renders the placeholder near-invisible on the dark
     * theme until the unlock (looked "under something" on slow first
     * loads). Pin the enabled-state look: explicit text color (disabled
     * inputs don't inherit the author color) and the same placeholder
     * formula Tailwind's preflight uses for the enabled state. */
    #textSearch:disabled {
      opacity: 1;
      color: var(--text);
    }

    #textSearch:disabled::placeholder {
      color: color-mix(in oklab, currentColor 50%, transparent);
      opacity: 1;
    }

    /* The cluster (and the surah dropdown inside it) must paint above the
     * border-beam layers (z-index 1–3 pseudo-elements/bloom on the pill).
     *
     * left:16px overrides the markup's left-3 (12px) — the selector sits a
     * touch further IN from the pill's left corner. Width budget at 360px
     * (placeholder "اكتب حرفين فأكثر من آية..." measures ~167px @16px):
     * pill 296 − borders 2 − right pad 12 − (left 16 + selector ~90 + gap 6)
     * = 170px ≥ 167 → no clipping; ::placeholder ellipsis stays the failsafe. */
    #searchPillActions {
      z-index: 4;
      left: 16px;
    }

    /* Pin the surah selector to an explicit box (height, padding, radius,
     * flex centering) so Arabic line-box differences across OS font stacks
     * can't change its geometry; mushaf.css only colors/fonts it. */
    #searchPillActions .mushaf-surah-select {
      box-sizing: border-box;
      height: 28px;
      display: inline-flex;
      align-items: center;
      padding: 0 16px;
      line-height: 1;
      border-radius: 12px;
    }

    /* The surah dropdown hangs below the search panel, over the next .glass
     * section (Mushaf/tafsir card). Both panels are backdrop-filter stacking
     * contexts, and later siblings paint on top — lift the search panel so
     * the dropdown wins. Stays under the sticky header (z-40). */
    #searchPanel {
      position: relative;
      z-index: 30;
    }

    /* Older / smaller phones (~ ≤ 400 CSS px wide — iPhone SE, older Androids,
     * etc.) saw an oversized gap between the placeholder text and the input's
     * right edge from the default px-10 (40px) padding. The left side is
     * handled by the --search-actions-w calc above; tighten the right side
     * to 12px so the text starts close to the edge (funds the wider surah
     * selector — see the width budget on #searchPillActions). Modern phones
     * (Pixel 8 ≈ 412 CSS px, iPhone 14 ≈ 390) and up keep the original px-10. */
    @media (max-width: 400px) {
      #textSearch {
        padding-right: 12px;
      }
    }

    /* === Border beam on the hero search input pill ===
     * Ported from https://github.com/Jakubantalik/border-beam
     * (MIT License, Copyright (c) 2026 Jakub Antalik).
     * Structure is the exact generateBorderVariantCSS() output for size="md",
     * strength={0.5}, default duration (1.96s), staticColors (no hue-shift).
     * Colors adapted from the mono grays to the site's primary-action blue
     * (#2644cd = the مختصر التفاسير button), shade ramp from that button's own
     * base/hover/active blues plus two white-mixed tints; the dark theme's
     * glowing head uses the lighter tint rgb(125, 143, 225) so it reads on dark.
     * Light-theme opacity factors are pre-divided by the 0.5 strength so the
     * effective values land on the source's full light preset (.12/.26/.34) —
     * the mono-halved values were invisible over the white pill.
     * Radius 18px = the search pill's .input-glass
     * radius, matching the component's runtime auto-detection. Both theme presets are
     * inlined as variables and flipped by the site's .dark class (html + body).
     * Adaptations for a single instance: per-instance id suffixes dropped,
     * offscreen-pause state + IntersectionObserver omitted, container
     * overflow:hidden dropped (layers self-clip via clip-path; it would clip
     * the input's focus ring). The active→fading lifecycle IS ported: the pill
     * starts [data-active]; choosing an ayah calls deactivateSearchBeam()
     * (src/app.js), which swaps to [data-fading] → beam-fade-out 0.5s and then
     * drops the attribute on animationend, removing every beam layer. */
    @property --beam-angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: true;
    }

    @property --beam-opacity {
      syntax: "<number>";
      initial-value: 0;
      inherits: true;
    }

    .border-beam {
      position: relative;
      border-radius: 18px;
      /* md/light preset ÷ 0.5 strength ⇒ effective .12/.26/.34 (source light values) */
      --beam-strength: 0.5;
      --beam-stroke-opacity: 0.24;
      --beam-inner-opacity: 0.52;
      --beam-bloom-opacity: 0.68;
      --beam-inner-shadow: rgba(38, 68, 205, 0.14);
      --beam-saturation: 1.50;
      --beam-edge-gradient: conic-gradient(
        from var(--beam-angle),
        transparent 0%, transparent 54%,
        rgba(38, 68, 205, 0.08) 57%,
        rgba(38, 68, 205, 0.2) 60%,
        rgba(38, 68, 205, 0.4) 63%,
        rgba(38, 68, 205, 0.55) 66%,
        rgba(38, 68, 205, 0.4) 69%,
        rgba(38, 68, 205, 0.2) 72%,
        rgba(38, 68, 205, 0.08) 75%,
        transparent 78%, transparent 100%
      );
      --beam-bloom-gradient: conic-gradient(
        from var(--beam-angle),
        transparent 0%, transparent 58%,
        rgba(38, 68, 205, 0.02) 62%,
        rgba(38, 68, 205, 0.08) 65%,
        rgba(38, 68, 205, 0.2) 67%,
        rgba(38, 68, 205, 0.4) 69%,
        rgba(38, 68, 205, 0.6) 70%,
        rgba(38, 68, 205, 0.6) 70.5%,
        rgba(38, 68, 205, 0.4) 71.5%,
        rgba(38, 68, 205, 0.2) 73%,
        rgba(38, 68, 205, 0.08) 75%,
        rgba(38, 68, 205, 0.02) 78%,
        transparent 82%
      );
    }

    /* Source lifecycle: animating while active; choosing an ayah swaps the
       attribute to data-fading (see deactivateSearchBeam() in src/app.js),
       and when beam-fade-out ends the attribute is removed — no beam layers
       exist after that, so all per-frame paint work stops. */
    /* Spin slowed to 2× the component default (1.96s → 3.92s) — site
       preference for calmer motion. */
    .border-beam[data-active] {
      animation:
        beam-spin 3.92s linear infinite,
        beam-fade-in 0.6s ease forwards;
    }

    .border-beam[data-fading] {
      animation:
        beam-spin 3.92s linear infinite,
        beam-fade-out 0.5s ease forwards;
    }

    body.dark .border-beam,
    html.dark .border-beam {
      /* md/dark preset, mono-halved (intensity unchanged — recolored only):
         stroke .13, inner .21, bloom .12 */
      --beam-stroke-opacity: 0.13;
      --beam-inner-opacity: 0.21;
      --beam-bloom-opacity: 0.12;
      --beam-inner-shadow: rgba(125, 143, 225, 0.27);
      --beam-saturation: 1.20;
      --beam-edge-gradient: conic-gradient(
        from var(--beam-angle),
        transparent 0%, transparent 54%,
        rgba(125, 143, 225, 0.1) 57%,
        rgba(125, 143, 225, 0.3) 60%,
        rgba(125, 143, 225, 0.6) 63%,
        rgba(125, 143, 225, 0.75) 66%,
        rgba(125, 143, 225, 0.6) 69%,
        rgba(125, 143, 225, 0.3) 72%,
        rgba(125, 143, 225, 0.1) 75%,
        transparent 78%, transparent 100%
      );
      --beam-bloom-gradient: conic-gradient(
        from var(--beam-angle),
        transparent 0%, transparent 58%,
        rgba(125, 143, 225, 0.03) 62%,
        rgba(125, 143, 225, 0.08) 65%,
        rgba(125, 143, 225, 0.2) 67%,
        rgba(125, 143, 225, 0.45) 69%,
        rgba(125, 143, 225, 0.85) 70%,
        rgba(125, 143, 225, 0.85) 70.5%,
        rgba(125, 143, 225, 0.45) 71.5%,
        rgba(125, 143, 225, 0.2) 73%,
        rgba(125, 143, 225, 0.08) 75%,
        rgba(125, 143, 225, 0.03) 78%,
        transparent 82%
      );
    }

    /* Beam stroke: mono radial field + theme edge highlight, masked to a
       1px ring intersected with the rotating conic window. */
    .border-beam[data-active]::after,
    .border-beam[data-fading]::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 17px;
      padding: 1px;
      clip-path: inset(0 round 18px);
      background: var(--beam-edge-gradient),
        radial-gradient(ellipse 70px 40px at 33% -7.4%, rgb(92, 115, 218), transparent),
        radial-gradient(ellipse 60px 35px at 12% -5%, rgb(33, 59, 178), transparent),
        radial-gradient(ellipse 40px 70px at 2.1% 68.3%, rgb(38, 68, 205), transparent),
        radial-gradient(ellipse 20px 35px at 2.1% 68.3%, rgb(28, 50, 150), transparent),
        radial-gradient(ellipse 180px 32px at 74.4% 100%, rgb(92, 115, 218), transparent),
        radial-gradient(ellipse 85px 26px at 55% 100%, rgb(38, 68, 205), transparent),
        radial-gradient(ellipse 74px 32px at 93.9% 0%, rgb(136, 152, 228), transparent),
        radial-gradient(ellipse 26px 42px at 100% 27.1%, rgb(33, 59, 178), transparent),
        radial-gradient(ellipse 52px 48px at 100% 27.1%, rgb(38, 68, 205), transparent);
      -webkit-mask:
        conic-gradient(
          from var(--beam-angle),
          transparent 0%, transparent 30%,
          rgba(255, 255, 255, 0.1) 36%, rgba(255, 255, 255, 0.35) 44%,
          white 52%, white 80%,
          rgba(255, 255, 255, 0.35) 86%, rgba(255, 255, 255, 0.1) 92%,
          transparent 95%, transparent 100%
        ),
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: source-in, xor;
      mask:
        conic-gradient(
          from var(--beam-angle),
          transparent 0%, transparent 30%,
          rgba(255, 255, 255, 0.1) 36%, rgba(255, 255, 255, 0.35) 44%,
          white 52%, white 80%,
          rgba(255, 255, 255, 0.35) 86%, rgba(255, 255, 255, 0.1) 92%,
          transparent 95%, transparent 100%
        ),
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      mask-composite: intersect, exclude;
      pointer-events: none;
      z-index: 2;
      opacity: calc(var(--beam-opacity) * var(--beam-stroke-opacity) * var(--beam-strength, 1));
    }

    /* Inner glow: dimmed radials + inset sheen, masked to a 28px edge band
       under the same rotating window. */
    .border-beam[data-active]::before,
    .border-beam[data-fading]::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 18px;
      background:
        radial-gradient(ellipse 63px 36px at 33% -7.4%, rgba(92, 115, 218, 0.225), transparent),
        radial-gradient(ellipse 54px 32px at 12% -5%, rgba(33, 59, 178, 0.225), transparent),
        radial-gradient(ellipse 36px 63px at 2.1% 68.3%, rgba(38, 68, 205, 0.225), transparent),
        radial-gradient(ellipse 18px 32px at 2.1% 68.3%, rgba(28, 50, 150, 0.225), transparent),
        radial-gradient(ellipse 162px 29px at 74.4% 100%, rgba(92, 115, 218, 0.225), transparent),
        radial-gradient(ellipse 77px 23px at 55% 100%, rgba(38, 68, 205, 0.225), transparent),
        radial-gradient(ellipse 67px 29px at 93.9% 0%, rgba(136, 152, 228, 0.225), transparent),
        radial-gradient(ellipse 23px 38px at 100% 27.1%, rgba(33, 59, 178, 0.225), transparent),
        radial-gradient(ellipse 47px 43px at 100% 27.1%, rgba(38, 68, 205, 0.225), transparent);
      box-shadow: inset 0 0 9px 1px var(--beam-inner-shadow);
      -webkit-mask-image:
        conic-gradient(
          from var(--beam-angle),
          transparent 0%, transparent 30%,
          rgba(255, 255, 255, 0.1) 36%, rgba(255, 255, 255, 0.35) 44%,
          white 52%, white 80%,
          rgba(255, 255, 255, 0.35) 86%, rgba(255, 255, 255, 0.1) 92%,
          transparent 95%, transparent 100%
        ),
        linear-gradient(white, transparent 28px, transparent calc(100% - 28px), white),
        linear-gradient(to right, white, transparent 28px, transparent calc(100% - 28px), white);
      -webkit-mask-composite: source-in, source-over;
      mask-image:
        conic-gradient(
          from var(--beam-angle),
          transparent 0%, transparent 30%,
          rgba(255, 255, 255, 0.1) 36%, rgba(255, 255, 255, 0.35) 44%,
          white 52%, white 80%,
          rgba(255, 255, 255, 0.35) 86%, rgba(255, 255, 255, 0.1) 92%,
          transparent 95%, transparent 100%
        ),
        linear-gradient(white, transparent 28px, transparent calc(100% - 28px), white),
        linear-gradient(to right, white, transparent 28px, transparent calc(100% - 28px), white);
      mask-composite: intersect, add;
      pointer-events: none;
      z-index: 1;
      opacity: calc(var(--beam-opacity) * var(--beam-inner-opacity) * var(--beam-strength, 1));
      clip-path: inset(0 round 18px);
    }

    /* Blurred bloom "head" riding the 1px ring. */
    .border-beam [data-beam-bloom] {
      display: none;
      position: absolute;
      inset: 0;
      border-radius: 17px;
      clip-path: inset(0 round 18px);
      background: var(--beam-bloom-gradient);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      padding: 1px;
      filter: blur(8px) brightness(1.30) saturate(var(--beam-saturation));
      pointer-events: none;
      z-index: 3;
      opacity: 0;
    }

    .border-beam[data-active] [data-beam-bloom],
    .border-beam[data-fading] [data-beam-bloom] {
      display: block;
      opacity: calc(var(--beam-opacity) * var(--beam-bloom-opacity) * var(--beam-strength, 1));
    }

    @keyframes beam-spin {
      to {
        --beam-angle: 360deg;
      }
    }

    @keyframes beam-fade-in {
      to {
        --beam-opacity: 1;
      }
    }

    @keyframes beam-fade-out {
      from {
        --beam-opacity: 1;
      }

      to {
        --beam-opacity: 0;
      }
    }

    /* Updated Container: Adds spacing/gap between items */
    .results-list {

      display: flex;
      flex-direction: column;
      gap: 12px;
      /* The "Gap" that stops them from morphing into each other */
      padding: 12px;

    /* Browser autofill (saved-search dropdown) paints the input white from
     * outside CSS — defeat it by overriding with a giant inset box-shadow,
     * the only property that beats -webkit-autofill's background.
     *
     * Notes:
     * - Opaque inset (no rgba alpha) so the browser's frozen autofill
     *   background-color cannot bleed through during a theme toggle.
     * - transition: none kills the Tailwind 150ms easing on this state
     *   so theme toggles swap colors instantly — no laggy fade where
     *   the inset is mid-transition while the underlying background
     *   sits in the old theme. */
    .input-glass:-webkit-autofill,
    .input-glass:-webkit-autofill:hover,
    .input-glass:-webkit-autofill:focus,
    .input-glass:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 1000px #f1f5f9 inset !important;
      -webkit-text-fill-color: #0f172a !important;
      caret-color: #0f172a !important;
      transition: none !important;
    }

    body.dark .input-glass:-webkit-autofill,
    body.dark .input-glass:-webkit-autofill:hover,
    body.dark .input-glass:-webkit-autofill:focus,
    body.dark .input-glass:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 1000px #222830 inset !important;
      -webkit-text-fill-color: var(--text) !important;
      caret-color: var(--text) !important;

    /* ============================================================
     * مختصر التفاسير — BorderBeam "Pulse Outside" glow
     * Ported from https://github.com/Jakubantalik/border-beam
     * (MIT License, Copyright (c) 2026 Jakub Antalik).
     * Exact generatePulseOuterVariantCSS() output for
     *   size="pulse-outside" colorVariant="ocean" strength={0.5}
     * (the playground settings), instance id "mukhtasar", radius 16px
     * (the button's rounded-2xl). Breathing runs at duration 4.6s — 2×
     * the component default, set in src/pulse-beam.js. Site adaptations:
     *   - both component theme presets are emitted (light as base,
     *     body.dark/html.dark overrides) since the site theme-toggles;
     *     each preset's values are the component's own, untouched;
     *   - radius via --mukhtasar-r so the compact ≤640px layout

    @property --bw1-mukhtasar { syntax: "<number>"; initial-value: 1; inherits: true; }
    @property --bh1-mukhtasar { syntax: "<number>"; initial-value: 1; inherits: true; }
    @property --bw2-mukhtasar { syntax: "<number>"; initial-value: 1; inherits: true; }
    @property --bh2-mukhtasar { syntax: "<number>"; initial-value: 1; inherits: true; }
    @property --bw3-mukhtasar { syntax: "<number>"; initial-value: 1; inherits: true; }
    @property --bh3-mukhtasar { syntax: "<number>"; initial-value: 1; inherits: true; }

    @property --bop-tl-mukhtasar { syntax: "<number>"; initial-value: 1; inherits: true; }

      --mukhtasar-core-bg:

        radial-gradient(ellipse calc(19px * var(--bw1-mukhtasar) * var(--pulse-glow-sx, 1)) calc(38px * var(--bh1-mukhtasar) * var(--bgh-mukhtasar) * var(--pulse-glow-sy, 1)) at calc(101% + var(--bx1-mukhtasar)) calc(72% + var(--by1-mukhtasar)), rgba(130, 70, 255, var(--bop-br-mukhtasar)), transparent),
        radial-gradient(ellipse calc(84px * var(--bw2-mukhtasar) * var(--pulse-glow-sx, 1)) calc(13px * var(--bh2-mukhtasar) * var(--bgh-mukhtasar) * var(--pulse-glow-sy, 1)) at calc(67% + var(--bx2-mukhtasar)) calc(100% + var(--by2-mukhtasar)), rgba(120, 80, 255, var(--bop-br-mukhtasar)), transparent),
        radial-gradient(ellipse calc(60px * var(--bw3-mukhtasar) * var(--pulse-glow-sx, 1)) calc(21px * var(--bh3-mukhtasar) * var(--bgh-mukhtasar) * var(--pulse-glow-sy, 1)) at calc(24% + var(--bx3-mukhtasar)) calc(101% + var(--by3-mukhtasar)), rgba(60, 120, 255, var(--bop-bl-mukhtasar)), transparent),
        radial-gradient(ellipse calc(17px * var(--bw1-mukhtasar) * var(--pulse-glow-sx, 1)) calc(40px * var(--bh1-mukhtasar) * var(--bgh-mukhtasar) * var(--pulse-glow-sy, 1)) at calc(0% + var(--bx1-mukhtasar)) calc(60% + var(--by1-mukhtasar)), rgba(80, 100, 200, var(--bop-bl-mukhtasar)), transparent),
        radial-gradient(ellipse calc(13px * var(--bw2-mukhtasar) * var(--pulse-glow-sx, 1)) calc(32px * var(--bh2-mukhtasar) * var(--bgh-mukhtasar) * var(--pulse-glow-sy, 1)) at calc(-1% + var(--bx2-mukhtasar)) calc(28% + var(--by2-mukhtasar)), rgba(50, 140, 220, var(--bop-tl-mukhtasar)), transparent);
      /* PULSE_OUTER_BLOOM × ocean, frozen at the light-theme breathing

         compositor; only the cheap hue-rotate varies per frame. */
      --mukhtasar-bloom-bg:
        radial-gradient(ellipse calc(110px * var(--pulse-glow-sx, 1)) calc(30px * var(--pulse-glow-sy, 1)) at 27% 3%, rgba(100, 80, 220, 1), transparent),
        radial-gradient(ellipse calc(100px * var(--pulse-glow-sx, 1)) calc(20px * var(--pulse-glow-sy, 1)) at 73% 1%, rgba(140, 100, 240, 1), transparent),
        radial-gradient(ellipse calc(26px * var(--pulse-glow-sx, 1)) calc(62px * var(--pulse-glow-sy, 1)) at 100% 33%, rgba(90, 110, 230, 1), transparent),
        radial-gradient(ellipse calc(30px * var(--pulse-glow-sx, 1)) calc(56px * var(--pulse-glow-sy, 1)) at 101% 72%, rgba(130, 70, 255, 1), transparent),
        radial-gradient(ellipse calc(120px * var(--pulse-glow-sx, 1)) calc(22px * var(--pulse-glow-sy, 1)) at 67% 99%, rgba(120, 80, 255, 1), transparent),
        radial-gradient(ellipse calc(88px * var(--pulse-glow-sx, 1)) calc(32px * var(--pulse-glow-sy, 1)) at 24% 99%, rgba(60, 120, 255, 1), transparent),

    /* Dark frozen bloom alpha: 1 - op/2 with op=.46 → 0.77 */
    body.dark .mukhtasar-beam,
    html.dark .mukhtasar-beam {
      --mukhtasar-bloom-bg:
        radial-gradient(ellipse calc(110px * var(--pulse-glow-sx, 1)) calc(30px * var(--pulse-glow-sy, 1)) at 27% 3%, rgba(100, 80, 220, 0.77), transparent),
        radial-gradient(ellipse calc(100px * var(--pulse-glow-sx, 1)) calc(20px * var(--pulse-glow-sy, 1)) at 73% 1%, rgba(140, 100, 240, 0.77), transparent),
        radial-gradient(ellipse calc(26px * var(--pulse-glow-sx, 1)) calc(62px * var(--pulse-glow-sy, 1)) at 100% 33%, rgba(90, 110, 230, 0.77), transparent),
        radial-gradient(ellipse calc(30px * var(--pulse-glow-sx, 1)) calc(56px * var(--pulse-glow-sy, 1)) at 101% 72%, rgba(130, 70, 255, 0.77), transparent),
        radial-gradient(ellipse calc(120px * var(--pulse-glow-sx, 1)) calc(22px * var(--pulse-glow-sy, 1)) at 67% 99%, rgba(120, 80, 255, 0.77), transparent),
        radial-gradient(ellipse calc(88px * var(--pulse-glow-sx, 1)) calc(32px * var(--pulse-glow-sy, 1)) at 24% 99%, rgba(60, 120, 255, 0.77), transparent),
        radial-gradient(ellipse calc(28px * var(--pulse-glow-sx, 1)) calc(58px * var(--pulse-glow-sy, 1)) at 0% 60%, rgba(80, 100, 200, 0.77), transparent);
    }

    /* The button fills the wrapper (which is now the flex/grid item in the
       row layouts). !important beats `.tafsir-compare-btn { width: 150px }`. */
    .mukhtasar-beam > #compareTafsirsBtn {
      width: 100% !important;
    }

    [data-beam="mukhtasar"] {
      position: relative;
      border-radius: var(--mukhtasar-r);
      overflow: visible;
      isolation: isolate;
    }

    [data-beam="mukhtasar"][data-active] {
      animation: beam-fade-in-mukhtasar 0.6s ease forwards;
    }

    [data-beam="mukhtasar"][data-fading] {
      animation: beam-fade-out-mukhtasar 0.5s ease forwards;
    }

    /* Crisp 1px colored stroke hugging the outer edge (masked ring). */
    [data-beam="mukhtasar"][data-active]::after,
    [data-beam="mukhtasar"][data-fading]::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: var(--mukhtasar-r);
      padding: 1px;
      clip-path: inset(0 round var(--mukhtasar-r));
      background: var(--mukhtasar-core-bg);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      pointer-events: none;
      z-index: 2;
      will-change: opacity, filter;
      opacity: calc(var(--beam-opacity-mukhtasar) * 1.96 * var(--beam-strength, 1));
      filter: hue-rotate(var(--beam-hue-mukhtasar)) brightness(1.70) saturate(0.60);
    }

    body.dark [data-beam="mukhtasar"][data-active]::after,
    body.dark [data-beam="mukhtasar"][data-fading]::after,
    html.dark [data-beam="mukhtasar"][data-active]::after,
    html.dark [data-beam="mukhtasar"][data-fading]::after {
      opacity: calc(var(--beam-opacity-mukhtasar) * 0.94 * var(--beam-strength, 1));
      filter: hue-rotate(var(--beam-hue-mukhtasar)) brightness(1.90) saturate(1.20);
    }

    /* Colorful core radiating OUTWARD behind the opaque button (z:-1). */
    [data-beam="mukhtasar"][data-active]::before,
    [data-beam="mukhtasar"][data-fading]::before {
      content: "";
      position: absolute;
      inset: -10px;
      z-index: -1;
      border-radius: calc(var(--mukhtasar-r) + 10px);
      background: var(--mukhtasar-core-bg);
      transform: scale(0.95, 0.9);
      pointer-events: none;
      will-change: opacity, filter;
      opacity: calc(var(--beam-opacity-mukhtasar) * 1.04 * var(--beam-strength, 1));
      filter: blur(6px) hue-rotate(var(--beam-hue-mukhtasar)) brightness(1.70) saturate(0.60);
    }

    body.dark [data-beam="mukhtasar"][data-active]::before,
    body.dark [data-beam="mukhtasar"][data-fading]::before,
    html.dark [data-beam="mukhtasar"][data-active]::before,
    html.dark [data-beam="mukhtasar"][data-fading]::before {
      opacity: calc(var(--beam-opacity-mukhtasar) * 0.34 * var(--beam-strength, 1));
      filter: blur(3px) hue-rotate(var(--beam-hue-mukhtasar)) brightness(1.90) saturate(1.20);
    }

    /* Soft wide halo (heaviest blur — gradients frozen, hue-only motion). */
    [data-beam="mukhtasar"] [data-beam-bloom] {
      display: none;
      position: absolute;
      inset: -30px;
      z-index: -1;
      border-radius: calc(var(--mukhtasar-r) + 30px);
      background: var(--mukhtasar-bloom-bg);
      transform: scale(0.95, 0.9);
      pointer-events: none;
      will-change: transform;
      opacity: 0;
    }

    [data-beam="mukhtasar"][data-active] [data-beam-bloom],
    [data-beam="mukhtasar"][data-fading] [data-beam-bloom] {
      display: block;
      opacity: calc(var(--beam-opacity-mukhtasar) * 0.42 * var(--beam-strength, 1));
      filter: blur(15px) hue-rotate(var(--beam-hue-mukhtasar)) brightness(1.70) saturate(0.60);
    }

    body.dark [data-beam="mukhtasar"][data-active] [data-beam-bloom],
    body.dark [data-beam="mukhtasar"][data-fading] [data-beam-bloom],
    html.dark [data-beam="mukhtasar"][data-active] [data-beam-bloom],
    html.dark [data-beam="mukhtasar"][data-fading] [data-beam-bloom] {
      opacity: calc(var(--beam-opacity-mukhtasar) * 0.30 * var(--beam-strength, 1));
      filter: blur(22.5px) hue-rotate(var(--beam-hue-mukhtasar)) brightness(1.90) saturate(1.20);
    }

    @keyframes beam-fade-in-mukhtasar {
      to { --beam-opacity-mukhtasar: 1; }
    }

    @keyframes beam-fade-out-mukhtasar {
      from { --beam-opacity-mukhtasar: 1; }
      to { --beam-opacity-mukhtasar: 0; }
    }

    [data-beam="mukhtasar"][data-paused],
    [data-beam="mukhtasar"][data-paused]::after,
    [data-beam="mukhtasar"][data-paused]::before,
    [data-beam="mukhtasar"][data-paused] [data-beam-bloom] {
      animation-play-state: paused !important;
    }

    @media (prefers-reduced-motion: reduce) {
      [data-beam="mukhtasar"][data-active],
      [data-beam="mukhtasar"][data-fading],
      [data-beam="mukhtasar"][data-active]::after,
      [data-beam="mukhtasar"][data-fading]::after,
      [data-beam="mukhtasar"][data-active]::before,
      [data-beam="mukhtasar"][data-fading]::before,
      [data-beam="mukhtasar"][data-active] [data-beam-bloom],
      [data-beam="mukhtasar"][data-fading] [data-beam-bloom] {
        animation: none !important;
      }
    }

    /* Audio toolbar buttons (⚙ / ▶) — INHERIT from public/mushaf.css's base
       .mushaf-toolbar__btn so they look and behave identically to the Tadabbur
       (Mushaf) toolbar: 38×38, neutral var(--card2), hover tint via
       --accent-soft, gear rotation on hover, green tint when playing. The
       previous Tafsir-specific solid-blue + static-gear overrides created a
       visual divergence from Tadabbur and are no longer needed.

       Desktop: keep the toolbar vertical alignment + slight nudge against the
       taller pills next to it, but NOT the button-size override (38×38 stays). */
    @media (min-width: 640px) {
      .tafsir-audio-toolbar {
        align-self: center;
        transform: translate(8px, -2px);
      }
    }

    /* ============================================================
     * Tafsir toolbar dropdowns — nuclear stacking + opacity fix
     *
     * Root cause: .mushaf-toolbar__dropdown has opacity:0→1 (animated),
     * backdrop-filter:blur, and rgba(--card) background. The parent
     * #tafsirSection (.glass) ALSO has backdrop-filter. Sibling #tafsirBox /
     * #tafsirAyahTag spawn transient stacking contexts (transform + opacity
     * animations). The combination made the dropdown panel partially
     * transparent — tafsir text visibly bled through.
     *
     * Applied with !important and at every viewport so nothing inherited
     * from the base mushaf-toolbar__dropdown rule can overpower it:
     *  - Solid bg color (no rgba, no var, no gradient).
     *  - backdrop-filter completely off.
     *  - Open state uses visibility, not opacity, so there's no mid-fade
     *    semi-transparent frame.
     *  - z-index 99999 on dropdowns + their wraps so they win against
     *    every sibling stacking context.
     *  - isolation:isolate on each dropdown so the panel always composites
     *    as its own group regardless of parent backdrop-filter quirks.
     * ============================================================ */

    /* App only: the phone's physical buttons make in-app volume controls
       redundant — hide the مستوى الصوت section in BOTH toolbars' dropdowns
       (Mushaf #mushafVolDropdown + Tafsir #tafsirVolDropdown), keeping
       only السرعة. html.is-app is the canonical app marker (set before
       first paint by the early inline script), so the website keeps its
       volume sliders. */
    html.is-app [data-volume-section] {
      display: none !important;
    }

    #tafsirVolDropdown,
    #tafsirSettingsWrap > [data-tafsir-settings-dropdown] {
      background-color: #ffffff !important;
      background-image: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      opacity: 1 !important;
      z-index: 99999 !important;
      isolation: isolate !important;
      transition: transform 180ms ease !important;
    }

    html.dark #tafsirVolDropdown,
    body.dark #tafsirVolDropdown,
    html.dark #tafsirSettingsWrap > [data-tafsir-settings-dropdown],
    body.dark #tafsirSettingsWrap > [data-tafsir-settings-dropdown] {
      /* Solid equivalent of the Mushaf toolbar dropdown's dark var(--card)
         rgba(40,46,54,.92) — the old #1e293b slate-BLUE visibly diverged
         from the Mushaf panel grey. Solid (not rgba) on purpose: this is
         the nuclear no-bleed-through fix. */
      background-color: #282e36 !important;
    }

    /* Closed state via visibility — no opacity fade that could ever
       expose content behind the panel for even a frame. */
    #tafsirVolDropdown:not(.mushaf-toolbar__dropdown--open),
    #tafsirSettingsWrap > [data-tafsir-settings-dropdown]:not(.mushaf-toolbar__dropdown--open) {
      visibility: hidden !important;
      pointer-events: none !important;
    }

    #tafsirVolDropdown.mushaf-toolbar__dropdown--open,
    #tafsirSettingsWrap > [data-tafsir-settings-dropdown].mushaf-toolbar__dropdown--open {
      visibility: visible !important;
      pointer-events: auto !important;
    }

    /* Wraps + the whole toolbar row need to be above the tafsir content
       row beneath them — because tafsir-top-row and the mt-6 (compare panel /
       ayah nav / tafsir box) are siblings with z-index:auto, the later
       (mt-6) paints on top of the earlier (top-row) by document order.
       Lift the row out of that order. */
    #tafsirPlayWrap,
    #tafsirSettingsWrap {
      z-index: 99999 !important;
    }

    #tafsirSection .tafsir-top-row {
      position: relative;
      z-index: 50;
    }

    /* ── Round 3: cap the panel's stacking domain ──────────────────────
       The z-values above (top-row 50, the wraps' 99999, audio dropdowns
       50, the tafsir-select menu 60) exist for LOCAL ordering inside the
       panel — but with no z-capped ancestor they competed at ROOT level
       and floated the cog / play / مختصر / select right over the frozen
       header (z-40) and the status-bar strip when the page scrolled.
       isolation:isolate turns each panel into its own stacking context
       with z-index:auto: every inner z keeps its relative meaning, yet
       nothing inside can ever paint above the header or any overlay.
       Fullscreen is unaffected — .mushaf-root--fullscreen's z-index:1000
       sits on the root element itself, which still competes at root level. */
    #tafsirSection,
    .mushaf-root {
      isolation: isolate;
    }

    .compare-scroll {
      max-height: 60vh;
      overflow: auto;
      scrollbar-gutter: stable;
    }

    #tafsirComparePanel.is-expanded .compare-scroll {
      max-height: none;
      overflow: visible;
    }

    #tafsirCompareContent {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .24s ease, transform .24s ease;
    }

    /* Tafsir title + info button. The description is now a click-to-open
       popover anchored to this row instead of always-visible text. */
    .tafsir-title-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tafsir-desc-btn {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      padding: 0;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--muted, #64748b);
      cursor: pointer;
      flex-shrink: 0;
      transition: color .15s ease, background .15s ease;
    }

    .tafsir-desc-btn:hover,
    .tafsir-desc-btn[aria-expanded="true"] {
      color: var(--accent-strong, #0b6bdc);
      background: rgba(148, 163, 184, 0.14);
    }

    .tafsir-desc-btn svg {
      width: 16px;
      height: 16px;
    }

    #tafsirDesc.tafsir-desc-pop {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 50;
      max-width: min(280px, 78vw);
      width: max-content;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--card, #ffffff);
      border: 1px solid var(--line, rgba(15, 23, 42, 0.1));
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.14);
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1.6;
      color: var(--muted, #64748b);
      text-align: right;
      white-space: normal;
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
    }

    #tafsirDesc.tafsir-desc-pop.is-open {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    .fade-in.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ====================================================================
     * Offline downloads panel (APP ONLY — button revealed by JS via isApp())
     * ==================================================================== */

    /* App-only header actions cluster (offline + feedback buttons). Empty on
       the website — both children start display:none and are revealed by their
       respective panel modules behind isApp(). */
    .header-app-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .offline-menu-btn,
    .feedback-menu-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ffffff, #f8fafc);
      border: 1px solid rgba(15, 23, 42, .12);
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
      color: #334155;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    /* Hover styles are the visual INVERSE of the normal styles (dark in
     * light mode, light in dark mode). On touch devices :hover sticks
     * after a tap until the next touch elsewhere, so the post-tap button
     * froze in this inverse state — looking like a "selected in opposite
     * theme color" highlight. Gating hover to @media (hover: hover) ensures
     * only true pointer devices (mouse, trackpad) get hover effects; touch
     * never sticks. Same pattern as .theme-toggle:hover above.
     * The remaining header button (#settingsMenuBtn) reuses .offline-menu-btn. */
    @media (hover: hover) {
      .offline-menu-btn:hover,
      .feedback-menu-btn:hover {
        background: linear-gradient(135deg, #1e293b, #334155);
        border-color: rgba(15, 23, 42, .2);
        color: #f1f5f9;
        transform: translateY(-1px);
      }
    }

    body.dark .offline-menu-btn,
    body.dark .feedback-menu-btn {
      background: linear-gradient(135deg, #232933, #1f252e);
      border-color: rgba(148, 163, 184, .2);
      color: #e2e8f0;
    }

    @media (hover: hover) {
      body.dark .offline-menu-btn:hover,
      body.dark .feedback-menu-btn:hover {
        background: linear-gradient(135deg, #ffffff, #f1f5f9);
        border-color: rgba(148, 163, 184, .3);
        color: #1e293b;
      }

    /* Backdrop + centered card */
    .offline-sheet {
      position: fixed;
      inset: 0;
      /* Above the Mushaf fullscreen overlay (1000) + its re-anchored floating
         lantern/circles (1001) and the gharib tip (2100), so a sheet opened by
         a lantern tap INSIDE fullscreen paints over everything. */
      z-index: 2200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
      direction: rtl;
    }

    .offline-sheet--open { display: flex; }

    /* Lock the page behind ANY open header sheet so it can't be panned while a
       section is open (offline/feedback/notes/غريب all toggle this class). The
       position:fixed lock is the one iOS WKWebView honours — matches
       body.mushaf-fs-open; sheet-scroll-lock.js pins/restores the scroll
       offset so the page never jumps. */
    body.offline-sheet-open {
      position: fixed;
      left: 0;
      right: 0;
      width: 100%;
      overflow: hidden;
    }

    /* Shared backdrop scrim — ONE blurred dim surface behind every sheet,
       driven by body.offline-sheet-open. It stays put while panels swap (on a
       hop the body class toggles off+on synchronously, which the browser
       coalesces → no fade, no dip), and fades only when the first sheet opens
       or the last one closes. Promoted to its own layer so the viewport blur is
       rasterized ONCE and only opacity animates — no per-frame re-blur. This
       kills both the close/open jank (each sheet used to animate its own
       backdrop-filter) and the cross-fade blur dip on inner Settings hops. */
    .sheet-scrim {
      position: fixed;
      inset: 0;
      z-index: 2199;
      background: rgba(15, 23, 42, 0.42);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .24s ease, visibility 0s linear .24s;
      transform: translateZ(0);
      will-change: opacity;
    }
    body.offline-sheet-open .sheet-scrim {
      opacity: 1;
      visibility: visible;
      transition: opacity .24s ease, visibility 0s;
    }
    @media (prefers-reduced-motion: reduce) { .sheet-scrim { transition: none; } }

    .offline-sheet__backdrop {
      position: absolute;
      inset: 0;
      /* Dim + blur now live on the shared .sheet-scrim (one continuous surface
         across panel swaps). This element is just the click-to-close catcher. */
      background: transparent;
    }

    .offline-sheet__card {
      position: relative;
      width: min(440px, 100%);
      max-height: calc(100vh - 32px);
      overflow: auto;
      background: rgba(247, 251, 255, .96);
      border: 1px solid rgba(15, 23, 42, .08);
      border-radius: 22px;
      padding: 22px 22px 18px;
      box-shadow: 0 30px 80px rgba(15, 23, 42, .22);
      animation: offline-sheet-pop 220ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    body.dark .offline-sheet__card {
      background: rgba(35, 41, 51, .98);
      border-color: rgba(148, 163, 184, .18);
      color: #e2e8f0;
    }

    @keyframes offline-sheet-fade { from { opacity: 0 } to { opacity: 1 } }
    @keyframes offline-sheet-pop {
      from { opacity: 0; transform: translateY(8px) scale(.98) }
      to { opacity: 1; transform: translateY(0) scale(1) }
    }

    /* Smooth open/close for the collection + notes sheets. The overlay stays
       display:flex and fades as a whole (visibility-gated); the card adds a
       gentle scale — so BOTH directions animate with plain CSS transitions, no
       display:none snap. Overrides the base pop/fade keyframes. */
    .offline-sheet--smooth {
      display: flex;
      visibility: hidden;
      pointer-events: none;
      transition: visibility 0s linear .28s;
    }
    .offline-sheet--smooth.offline-sheet--open {
      visibility: visible;
      pointer-events: auto;
      transition: visibility 0s;
    }
    /* Blur fades on the BACKDROP itself (static blur + its own opacity) — NOT
       via the overlay's opacity. A backdrop-filter inside an opacity-animating
       ancestor blends wrong: it snaps in at the end. Fading the backdrop's own
       opacity is compositor-cheap AND blends the blur in smoothly. And because
       two sheets crossing over (sub-panel <-> Settings) overlap their fades,
       the blurred surface never drops out between them — no flash. */
    /* The blurred dim is the shared .sheet-scrim now; the sheet animates only
       its CARD (transform + opacity — compositor-cheap, no backdrop-filter in
       the animation path, so open/close no longer janks). */
    .offline-sheet--smooth .offline-sheet__card {
      animation: none;
      opacity: 0;
      transform: translateY(8px) scale(0.96);
      transition: opacity .2s ease, transform .26s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .offline-sheet--smooth.offline-sheet--open .offline-sheet__card {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

      transition: border-color 140ms ease, box-shadow 140ms ease;
    }
    .feedback-input:focus {
      border-color: #1d8fff;
      box-shadow: 0 0 0 3px rgba(29, 143, 255, .15);
    }
    body.dark .feedback-input {
      background: rgba(15, 23, 42, .35);
      color: #e2e8f0;
      border-color: rgba(148, 163, 184, .25);
    }
    body.dark .feedback-input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, .2);
    }

    .feedback-textarea {
      resize: vertical;
      min-height: 88px;
      max-height: 220px;
      line-height: 1.55;

    .feedback-counter {
      align-self: flex-start;

      color: #94a3b8;
      font-variant-numeric: tabular-nums;

    body.dark .feedback-counter { color: #64748b; }

    .feedback-honeypot {
      position: absolute;
      left: -9999px;
      top: -9999px;

      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;

    .feedback-submit { margin-top: 4px; }
    .feedback-submit:disabled { opacity: .65; cursor: default; transform: none; box-shadow: 0 4px 10px rgba(29, 143, 255, .18); }

    .feedback-status {
      min-height: 0;
      font-size: 13px;

    .feedback-status:empty { display: none; }
    .feedback-status--info { padding: 8px 10px; background: rgba(29, 143, 255, .08); color: #1976d2; }
    .feedback-status--ok { padding: 8px 10px; background: rgba(34, 197, 94, .12); color: #15803d; }
    .feedback-status--err { padding: 8px 10px; background: rgba(239, 68, 68, .12); color: #b91c1c; }
    body.dark .feedback-status--info { background: rgba(96, 165, 250, .14); color: #bfdbfe; }
    body.dark .feedback-status--ok { background: rgba(34, 197, 94, .18); color: #bbf7d0; }
    body.dark .feedback-status--err { background: rgba(239, 68, 68, .2); color: #fecaca; }

    /* --- Notes editor (sheet contents) --- */
    .notes-editor { display: flex; flex-direction: column; gap: 10px; }
    .notes-editor__ayah {
      font-family: 'Tajawal', 'IBM Plex Sans Arabic', system-ui, sans-serif;
      font-size: 14px; color: #475569; background: rgba(15, 23, 42, .04);
      padding: 10px 12px; border-radius: 12px; line-height: 1.7;
      max-height: 78px; overflow: auto; text-align: justify;
    }
    body.dark .notes-editor__ayah { background: rgba(148, 163, 184, .1); color: #cbd5e1; }
    .notes-editor__textarea { min-height: 110px; max-height: 240px; }
    .notes-editor__counter {
      align-self: flex-start; font-size: 11px; color: #94a3b8;
      font-variant-numeric: tabular-nums;
    }
    body.dark .notes-editor__counter { color: #64748b; }
    .notes-editor__actions {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px;

    .notes-editor__actions .offline-btn { min-width: 90px; }
    .notes-editor__hint {

    }
    body.dark .notes-editor__hint { color: #64748b; }

    /* --- Notes list (sheet contents) --- */
    .notes-list { display: flex; flex-direction: column; gap: 10px; max-height: 56vh; overflow-y: auto; padding-inline-end: 2px; }
    .notes-list__row {
      background: rgba(15, 23, 42, .04); border: 1px solid rgba(15, 23, 42, .06);
      border-radius: 14px; padding: 12px; cursor: pointer;
      transition: background 120ms ease, transform 120ms ease;
    }
    .notes-list__row:hover { background: rgba(29, 143, 255, .08); }
    body.dark .notes-list__row {
      background: rgba(148, 163, 184, .08); border-color: rgba(148, 163, 184, .14);
    }
    body.dark .notes-list__row:hover { background: rgba(96, 165, 250, .15); }
    .notes-list__row-head {

      gap: 8px; margin-bottom: 6px;
    }
    .notes-list__row-ref { font-weight: 800; font-size: 13.5px; color: #0f172a; }
    body.dark .notes-list__row-ref { color: #e2e8f0; }
    .notes-list__row-time { font-size: 11px; color: #94a3b8; }
    .notes-list__row-preview {

    body.dark .notes-list__row-preview { color: #cbd5e1; }
