  <script>
    (function () {
      try {
        var url = new URL(window.location.href);
        var params = new URLSearchParams(url.search);
        var cleanOrigin = "https://www.m7mdiyat.com";
        var surah = null, ayah = null;

        // Pattern 1: New clean URL format /surah/ayah
        var pathMatch = url.pathname.match(/^\/([0-9]+)\/([0-9]+)\/?$/);
        if (pathMatch) {
          surah = pathMatch[1];
          ayah = pathMatch[2];
        }

        // Pattern 1b: Mushaf reading mode routes — switch into mushaf early
        // so first paint isn't the Tafsir hero. Either via direct path
        // (when served by something that knows the route) or via the
        // 404.html → sessionStorage handoff on GitHub Pages.
        var mushafPath = url.pathname;
        try {
          var redirected = sessionStorage.getItem('mushaf_redirect');
          if (redirected) {
            sessionStorage.removeItem('mushaf_redirect');
            mushafPath = redirected;
            history.replaceState(null, "", mushafPath);
          }
        } catch {}

        var mushafPageMatch = mushafPath.match(/^\/read\/page\/([0-9]+)\/?$/);
        var mushafSurahMatch = mushafPath.match(/^\/read\/surah\/([0-9]+)\/?$/);
        var mushafAyahMatch = mushafPath.match(/^\/read\/ayah\/([0-9]+)\/([0-9]+)\/?$/);
        if (mushafPageMatch || mushafSurahMatch || mushafAyahMatch) {
          document.documentElement.setAttribute("data-app-mode", "mushaf");
          try { localStorage.setItem("app_mode", "mushaf"); } catch {}
          if (mushafPageMatch) window._mushafInit = { page: Number(mushafPageMatch[1]) };
          else if (mushafSurahMatch) window._mushafInit = { surah: Number(mushafSurahMatch[1]) };
          else if (mushafAyahMatch) window._mushafInit = { surah: Number(mushafAyahMatch[1]), ayah: Number(mushafAyahMatch[2]) };
        } else if (pathMatch) {
          // Tafsir-shaped URL (/surah/ayah) — URL wins over localStorage so the
          // user lands on the Tafsir view even if mushaf was their last mode.
          document.documentElement.setAttribute("data-app-mode", "tafsir");
        } else {
          // Default mode from localStorage
          try {
            var savedMode = localStorage.getItem("app_mode");
            document.documentElement.setAttribute("data-app-mode", savedMode === "mushaf" ? "mushaf" : "tafsir");
          } catch {
            document.documentElement.setAttribute("data-app-mode", "tafsir");
          }
        }

        // Pattern 2: Old query format ?v=surah-ayah (redirect to new format)
        var v = params.get("v") || params.get("ayah");
        if (!surah && v) {
          var parts = v.split(/[-:\/]/);
          if (parts.length >= 2) {
            surah = parts[0];
            ayah = parts[1];
            // Redirect old URL to new clean URL
            window.location.replace("/" + surah + "/" + ayah);
            return;
          }
        }

        // Pattern 3: Check sessionStorage for 404 redirect
        var redirSurah = sessionStorage.getItem('redirect_surah');
        var redirAyah = sessionStorage.getItem('redirect_ayah');
        if (!surah && redirSurah && redirAyah) {
          surah = redirSurah;
          ayah = redirAyah;
          sessionStorage.removeItem('redirect_surah');
          sessionStorage.removeItem('redirect_ayah');
          // Store in app state for later use
          window._redirectedAyah = { surah: surah, ayah: ayah };
        }

        // Build final canonical URL
        var finalUrl = cleanOrigin + "/";
        var pageTitle = "محمديات";

        if (surah && ayah) {
          finalUrl = cleanOrigin + "/" + surah + "/" + ayah;
          pageTitle = "تفسير سورة " + surah + " آية " + ayah + " | محمديات";
        }

        // Apply to canonical (most important for SEO)
        var link = document.getElementById("canonicalLink");
        if (link) link.href = finalUrl;

        // Apply to Open Graph
        var ogUrl = document.getElementById("ogUrl");
        if (ogUrl) ogUrl.content = finalUrl;
        var ogTitle = document.getElementById("ogTitle");
        if (ogTitle) ogTitle.content = pageTitle;

        // Apply to browser tab only if not already set by prerender
        if (document.title === "محمديات") {
          document.title = pageTitle;
        }

      } catch (e) { console.error("SEO Patch Error", e); }
    })();
  </script>

        display: flex !important;
        flex-direction: row !important;
        /* RTL: Right to Left */
        justify-content: space-between !important;
        align-items: flex-start !important;
        /* Align to top so text can grow downwards */
        gap: 20px !important;
        width: 100% !important;

      .tafsir-meta {
        flex: 1 1 auto !important;
        text-align: right !important;
        order: 1 !important;

      #tafsirDesc {

        height: auto !important;
        /* Let height grow automatically */

        /* Nice readable line spacing */

      /* 3. CONTROLS CONTAINER: Stable & Ordered */
      .tafsir-controls {

        /* Align with top of text */
        gap: 12px !important;

      /* Order 1 appears first (Rightmost in RTL) */

      #compareTafsirsBtn {
        order: 1 !important;
        width: auto !important;

      .tafsir-controls>div:nth-child(2) {
        order: 2 !important;
      }

      /* C. Next/Prev Wrapper -> Position 3 (Left) */
      .tafsir-controls>div:last-child {
        order: 3 !important;
      }

      /* 5. THE FIX: Lock Dropdown Width, Custom Arrow & Centered Text */
      #tafsirSelect {

        background-repeat: no-repeat !important;

      body.dark #tafsirSelect {

      }

      /* Reset Wrapper Display */
      .tafsir-controls>div {

        width: auto !important;
      }
    }

      gap: 10px;

    }

    #tafsirSelect {

                      <svg class="audio-pause-icon hidden" xmlns="http://www.w3.org/2000/svg" fill="none"

                      </svg>
                    </button>
                    <!-- Mobile hover dropdown -->
                    <div class="audio-dropdown">
                      <div class="audio-dropdown-content">
                        <div class="audio-reciter-row">
                          <span class="audio-reciter-name">علي جابر</span>
                          <!-- Mobile Listening Mode Button -->
                          <button type="button" class="listening-mode-btn mobile-listening-mode-btn audio-vol-btn"
                            title="وضع الإستماع" aria-pressed="false">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                              stroke="currentColor">
                              <path stroke-linecap="round" stroke-linejoin="round"
                                d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 00-3.7-3.7 48.678 48.678 0 00-7.324 0 4.006 4.006 0 00-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3l-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 003.7 3.7 48.656 48.656 0 007.324 0 4.006 4.006 0 003.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3l-3 3" />
                            </svg>
                          </button>
                          <!-- Speed control button -->
                          <button type="button" class="audio-speed-btn audio-vol-btn" title="سرعة التشغيل">
                            <span class="audio-speed-label">1x</span>
                          </button>
                          <!-- Switch reciter button -->
                          <button type="button" class="reciter-switch-btn" title="القارئ التالي">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                              stroke="currentColor">
                              <path stroke-linecap="round" stroke-linejoin="round"
                                d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                            </svg>
                          </button>
                          <!-- Play/Pause button -->
                          <button type="button" class="dropdown-play-btn audio-vol-btn" title="تشغيل">
                            <svg class="dropdown-play-icon" xmlns="http://www.w3.org/2000/svg" fill="none"
                              viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                              <path stroke-linecap="round" stroke-linejoin="round"
                                d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z" />
                            </svg>
                            <svg class="dropdown-pause-icon hidden" xmlns="http://www.w3.org/2000/svg" fill="none"
                              viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                              <path stroke-linecap="round" stroke-linejoin="round"
                                d="M15.75 5.25v13.5m-7.5-13.5v13.5" />
                            </svg>
                          </button>
                        </div>


                        <div class="audio-controls">

                          <button type="button" class="audio-vol-btn mobile-vol-down" title="خفض الصوت">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                              stroke="currentColor">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12h-15" />
                            </svg>
                          </button>
                          <input type="range" class="audio-slider mobile-vol-slider" min="0" max="100" value="80">
                          <button type="button" class="audio-vol-btn mobile-vol-up" title="رفع الصوت">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                              stroke="currentColor">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                            </svg>
                          </button>
                        </div>
                        <!-- Mobile Audio Seek Slider -->
                        <div class="audio-seek-row hidden mobile-seek-row">
                          <div class="audio-controls">
                            <button type="button" class="audio-vol-btn mobile-seek-back" title="تراجع 5 ثوانٍ">
                              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M21 16.811c0 .864-.933 1.405-1.683.977l-7.108-4.062a1.125 1.125 0 010-1.953l7.108-4.062A1.125 1.125 0 0121 8.688v8.123zM11.25 16.811c0 .864-.933 1.405-1.683.977l-7.108-4.062a1.125 1.125 0 010-1.953l7.108-4.062a1.125 1.125 0 011.683.977v8.123z" />
                              </svg>
                            </button>
                            <input type="range" class="audio-slider mobile-seek-slider" min="0" max="100" value="0">
                            <button type="button" class="audio-vol-btn mobile-seek-forward" title="تقدم 5 ثوانٍ">
                              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M3 8.688c0-.864.933-1.405 1.683-.977l7.108 4.062a1.125 1.125 0 010 1.953l-7.108 4.062A1.125 1.125 0 013 16.811V8.688zM12.75 8.688c0-.864.933-1.405 1.683-.977l7.108 4.062a1.125 1.125 0 010 1.953l-7.108 4.062a1.125 1.125 0 01-1.683-.977V8.688z" />
                              </svg>
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="mt-8 flex items-center justify-between gap-4 w-full">
                  <button type="button" id="prevAyahBtn" class="ayah-nav-btn group" aria-label="الآية السابقة">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                      stroke="currentColor" class="w-6 h-6 ml-0.5 transition-transform group-hover:translate-x-1">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                    </svg>
                  </button>

                  <div class="flex-1 px-2 text-center">
                    <div id="tafsirBasmala" class="quran-font text-center text-lg font-bold text-slate-700 hidden mb-4">
                    </div>
                    <div id="tafsirAyahTag"
                      class="quran-font text-2xl sm:text-3xl leading-[2.4] text-slate-900 transition-all text-center">—
                    </div>
                  </div>

                  <button type="button" id="nextAyahBtn" class="ayah-nav-btn group" aria-label="الآية التالية">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                      stroke="currentColor" class="w-6 h-6 mr-0.5 transition-transform group-hover:-translate-x-1">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                    </svg>
                  </button>
                </div>

                <div id="tafsirBox"
                  class="mt-6 rounded-3xl border border-slate-900/10 bg-white/65 p-5 leading-[2.2] text-[18px] text-slate-900"
                  style="max-height:520px; overflow:auto;">—</div>


              </div>

              <div class="mt-6 border-t border-slate-900/5 pt-5">
                <div class="flex items-center justify-between gap-3 flex-wrap">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span id="tafsirMetaInterpreter"
                      class="text-xs font-extrabold px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-700">نص
                      التفسير</span>
                    <span class="text-xs font-bold text-slate-500" id="contextHeader">اختر آية من نتائج البحث</span>
                  </div>

                  <div class="flex items-center gap-2">
                    <select id="langSelect"
                      class="bg-white/70 border border-slate-900/10 rounded-2xl px-4 py-2 text-sm font-bold outline-none focus:ring-4 focus:ring-blue-500/10 transition">
                      <option value="ar">العربية</option>
                      <option value="en">English (Khattab)</option>
                      <option value="both">العربية + English</option>
                    </select>
                    <button type="button" id="toggleVersesBtn" aria-expanded="false"
                      class="px-4 py-2 rounded-2xl bg-blue-600 text-white font-extrabold text-sm hover:opacity-90 transition">
                      سياق الآيات
                    </button>
                  </div>
                </div>

                <div id="versePanel" aria-hidden="true"
                  class="mt-4 rounded-3xl border border-slate-900/10 bg-white/55 p-4" style="max-height:0; overflow:hidden; opacity:0; transform: translateY(-4px);
                     transition:max-height .45s ease, opacity .35s ease, transform .35s ease;">
                  <div id="ayahContext" class="text-[18px] leading-[2.2]"
                    style="transition: opacity 0.2s ease, transform 0.2s ease;"></div>
                </div>
              </div>
            </div>
          </div>
        </div>


      </div>
    </section>

    <!-- AI (collapsed) -->
    <section class="pb-10">
      <div class="mx-auto max-w-2xl text-center">
        <button type="button" id="aiToggleBtn" aria-expanded="false" aria-disabled="true" disabled
          class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/70 border border-slate-900/10 transition font-extrabold text-sm text-slate-800 subtle cursor-not-allowed opacity-60">
          سؤال الذكاء الاصطناعي - قريبًا
          <span id="aiChevron" class="transition-transform">⌄</span>
        </button>

        <div id="aiPanel" data-open="0" class="mt-4">
          <div class="mt-8 mx-auto max-w-2xl glass rounded-3xl p-3">
            <div class="relative">
              <textarea id="aiQuestion" rows="1"
                class="input-glass w-full resize-none bg-transparent outline-none px-6 py-4 text-slate-900 placeholder:text-slate-400 text-base leading-6"
                placeholder="Ask a Quranic question... (Ctrl+Enter)"></textarea>
            </div>

            <div
              class="mt-3 flex flex-col sm:flex-row items-center justify-center gap-3 flex-wrap px-2 pb-1 text-center">
              <div class="flex gap-2 flex-wrap justify-center w-full">
                <button type="button"
                  class="px-3 py-1.5 rounded-full text-xs font-bold bg-slate-900/5 hover:bg-slate-900/10 transition"
                  data-ai-prompt="ما معنى الصبر في القرآن؟">الصبر</button>
                <button type="button"
                  class="px-3 py-1.5 rounded-full text-xs font-bold bg-slate-900/5 hover:bg-slate-900/10 transition"
                  data-ai-prompt="هل الصدقة واجبة؟">الصدقة</button>
                <button type="button"
                  class="px-3 py-1.5 rounded-full text-xs font-bold bg-slate-900/5 hover:bg-slate-900/10 transition"
                  data-ai-prompt="ما آيات التوكل على الله؟">التوكل</button>
              </div>

              <div class="flex gap-2 w-full justify-center">
                <button type="button" id="aiAskBtn"
                  class="px-4 py-2 rounded-2xl font-extrabold text-sm bg-slate-900 text-white hover:opacity-90 transition subtle">
                  ابحث
                </button>
                <button type="button" id="aiClearBtn"
                  class="px-4 py-2 rounded-2xl font-extrabold text-sm bg-white/60 border border-slate-900/10 hover:bg-white transition">
                  مسح
                </button>
              </div>
            </div>

            <div id="aiStatus" class="mt-2 text-xs font-bold text-slate-500 text-center px-2" aria-live="polite"></div>
          </div>
          <div id="aiResults" class="mt-8 mx-auto max-w-3xl"></div>
        </div>
      </div>
    </section>
    <!-- Tafsir + Context (shows after selecting an ayah) -->

  </main>

  <script>
    // Make the AI question textarea behave like a single-line field (auto grow to 3 lines max)
    (function () {
      const t = document.getElementById("aiQuestion");
      if (!t) return;
      const resize = () => {
        t.style.height = "auto";
        const max = 3 * 24; // approx
        t.style.height = Math.min(t.scrollHeight, max) + "px";
      };
      t.addEventListener("input", resize);
      resize();
    })();
    (function () {
      const btn = document.getElementById("aiToggleBtn");
      const panel = document.getElementById("aiPanel");
      const chevron = document.getElementById("aiChevron");
      if (!btn || !panel) return;
      const setOpen = (open) => {
        panel.dataset.open = open ? "1" : "0";
        panel.classList.toggle("is-open", !!open);
        btn.setAttribute("aria-expanded", open ? "true" : "false");
        if (chevron) chevron.style.transform = open ? "rotate(180deg)" : "rotate(0deg)";
      };
      setOpen(panel.dataset.open === "1" || panel.classList.contains("is-open"));
      btn.addEventListener("click", () => {
        const isOpen = panel.dataset.open === "1";
        setOpen(!isOpen);
      });
    })();
  </script>

  <!-- cache bust -->
  <script type="module" src="/src/app.js"></script>
