    /* ====================================================================
     * غريب القرآن — saved-words panel (APP ONLY). A lantern-gold variant of
     * the shared .offline-sheet shell: warm head icon, a count chip echoing
     * the lantern badge, and rows where each revealed word glows softly in
     * gold (static — calm). Removing a row forgets the word (gharibForget).
     * ==================================================================== */

    /* The collection holds short word rows — keep the card genuinely small and
       focused, well under the default 440px sheet. */
    #gharibSavedSheet .offline-sheet__card {
      width: min(300px, 90vw);
      max-height: min(76vh, 520px);
      padding: 18px 18px 14px;
      border-radius: 20px;
      /* Fixed header + internally-scrolling list: a flex column that never
         scrolls itself (overrides the base .offline-sheet__card overflow:auto)
         — the head stays put and only the word list scrolls, in its own region. */
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #gharibSavedSheet .offline-sheet__head { margin-bottom: 12px; flex-shrink: 0; }
    #gharibSavedSheet .offline-sheet__title { font-size: 16px; }

    /* Head logo → the bare lantern itself (no square box), warm gold body +
       lit flame. It IS the غريب emblem, so it stands alone as the header mark. */
    #gharibSavedSheet .offline-sheet__icon {
      background: none;
      width: auto;
      height: auto;
      margin-bottom: 8px;
      color: #c4a052;
    }
    body.dark #gharibSavedSheet .offline-sheet__icon { color: #d9b266; }
    #gharibSavedSheet .offline-sheet__icon svg { width: 40px; height: 40px; }
    #gharibSavedSheet .offline-sheet__icon .gharib-saved-btn__flame { fill: #e3a338; stroke: none; }
    body.dark #gharibSavedSheet .offline-sheet__icon .gharib-saved-btn__flame { fill: #f0c069; }

    /* The highlighted word in the panel's intro — picked out in the lantern's
       own warm gold (same palette as the flame above). */
    .gharib-saved-tadabbur { color: #e3a338; font-weight: 700; }
    body.dark .gharib-saved-tadabbur { color: #f0c069; }

    /* Head meta row: count chip + reset-all (or the reset confirmation). */
    .gharib-saved-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 11px;
    }
    .gharib-saved-meta:empty { display: none; }

    /* Count chip — echoes the lantern's gold badge. */
    .gharib-saved-count {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 11px 3px 9px;
      border-radius: 999px;
      background: linear-gradient(160deg, rgba(227, 163, 56, .14), rgba(192, 138, 30, .1));
      border: 1px solid rgba(176, 138, 60, .22);
      color: #a87718;
      font-size: 12.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .gharib-saved-count svg { width: 13px; height: 13px; }
    body.dark .gharib-saved-count {
      background: linear-gradient(160deg, rgba(240, 192, 105, .14), rgba(211, 154, 45, .08));
      border-color: rgba(240, 192, 105, .2);
      color: #f0c069;
    }

    /* Reset-all — quiet neutral pill that warms to red on hover/press. */
    .gharib-saved-reset {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 11px 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(15, 23, 42, .1);
      background: rgba(15, 23, 42, .03);
      color: #94a3b8;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, color .15s ease;
    }
    .gharib-saved-reset svg { width: 13px; height: 13px; }
    @media (hover: hover) {
      .gharib-saved-reset:hover {
        background: rgba(239, 68, 68, .1);
        border-color: rgba(239, 68, 68, .25);
        color: #dc2626;
      }
    }
    body.dark .gharib-saved-reset {
      border-color: rgba(148, 163, 184, .18);
      background: rgba(148, 163, 184, .08);
      color: #94a3b8;
    }
    @media (hover: hover) {
      body.dark .gharib-saved-reset:hover {
        background: rgba(239, 68, 68, .2);
        border-color: rgba(239, 68, 68, .35);
        color: #fca5a5;
      }
    }

    /* Reset confirmation (replaces the count + reset in the meta row). */
    .gharib-saved-confirm {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      width: 100%;
    }
    .gharib-saved-confirm__text { font-size: 12.5px; font-weight: 700; color: #b91c1c; }
    body.dark .gharib-saved-confirm__text { color: #fca5a5; }
    .gharib-saved-confirm__actions { display: flex; gap: 8px; }
    .gharib-saved-confirm__actions .offline-btn { min-width: 92px; }

    /* Scrollable list of revealed words. */
    .gharib-saved-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      /* Fill the card's remaining height and scroll INTERNALLY — the card no
         longer scrolls. min-height:0 lets this flex child shrink below its
         content so the overflow is contained here, not on the whole panel. */
      flex: 0 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-inline-end: 2px;
      margin-top: 2px;
    }
    /* Clean, thin scrollbar confined to the list (matches .results-list). */
    .gharib-saved-list::-webkit-scrollbar { width: 6px; }
    .gharib-saved-list::-webkit-scrollbar-track { background: transparent; }
    .gharib-saved-list::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 10px; }
    .gharib-saved-list::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.5); }

    .gharib-saved-row {
      position: relative;
      display: flex;
      flex: 0 0 auto;        /* never shrink in the scrolling column */
      align-items: center;
      gap: 8px;
      padding: 11px 13px;
      border-radius: 14px;
      background: rgba(255, 251, 242, .75);
      border: 1px solid rgba(176, 138, 60, .16);
      overflow: hidden;
      transition: max-height .3s cubic-bezier(.4, 0, .2, 1),
                  opacity .26s ease, padding .3s ease, margin .3s ease;
    }
    body.dark .gharib-saved-row {
      background: rgba(240, 192, 105, .045);
      border-color: rgba(240, 192, 105, .13);
    }

    /* word ‹ meaning — one horizontal gloss line (wraps only if very long). */
    .gharib-saved-row__gloss {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    .gharib-saved-row__word {
      flex: 0 1 auto;
      font-family: "MeQuran", "Amiri", serif;
      font-size: 20px;
      line-height: 1.5;
      color: #9a6f12;
      text-shadow: 0 0 13px rgba(227, 163, 56, .25);
    }
    body.dark .gharib-saved-row__word {
      color: #f0c069;
      text-shadow: 0 0 15px rgba(240, 192, 105, .3);
    }

    .gharib-saved-row__sep {
      flex: 0 0 auto;
      font-size: 15px;
      color: #c2a358;
      opacity: .85;
    }
    body.dark .gharib-saved-row__sep { color: #caa75f; }

    .gharib-saved-row__meaning {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 14.5px;
      line-height: 1.6;
      font-weight: 500;
      color: #5c5345;
      word-break: break-word;
    }
    body.dark .gharib-saved-row__meaning { color: #c9bfa9; }

    /* Remove (forget) — quiet by default, warms to red on hover. */
    .gharib-saved-row__remove {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: #b0a48c;
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    .gharib-saved-row__remove svg { width: 16px; height: 16px; }
    @media (hover: hover) {
      .gharib-saved-row__remove:hover { background: rgba(239, 68, 68, .12); color: #dc2626; }
      body.dark .gharib-saved-row__remove:hover { background: rgba(239, 68, 68, .2); color: #fca5a5; }
    }
    body.dark .gharib-saved-row__remove { color: #8b8472; }

    /* Collapse-out on removal (swallows its own gap). */
    .gharib-saved-row--removing {
      max-height: 0 !important;
      opacity: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin-top: -9px;
      border-width: 0;
      pointer-events: none;
    }

    /* Loading state (brief, while the dataset resolves on first open). */
    .gharib-saved-loading { text-align: center; padding: 32px 14px; color: #b08a3c; font-size: 13px; font-weight: 600; }

    @media (prefers-reduced-motion: reduce) {
      .gharib-saved-row { transition: background .18s ease, border-color .18s ease; }
    }

    /* --- First-launch offline tooltip (neutral grey, not blue) --- */
    .m7-tip {
      position: fixed;
      z-index: 1100;
      transform: translateX(-50%) translateY(-6px);
      background: #f8fafc;
      color: #334155;
      border-radius: 12px;
      padding: 8px 12px 8px 10px;

      font-size: 13px; font-weight: 600; line-height: 1.2;
      opacity: 0;
      transition: opacity 220ms ease, transform 220ms ease;
      pointer-events: auto;
      max-width: calc(100vw - 16px);
    }
    .m7-tip--show { opacity: 1; transform: translateX(-50%) translateY(0); }
    body.dark .m7-tip {
      background: #1e293b;
      color: #cbd5e1;
      border-color: rgba(148, 163, 184, 0.16);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4), 0 1px 4px rgba(0, 0, 0, 0.18);
    }
    .m7-tip__text { color: #334155; font-weight: 600; white-space: nowrap; }
    body.dark .m7-tip__text { color: #cbd5e1; }
    .m7-tip__arrow {
      position: absolute;
      top: -5px;
      left: 50%;                                       /* JS may override per-position */
      transform: translateX(-50%) rotate(45deg);
      width: 10px; height: 10px;
      background: #f8fafc;
      border-top: 1px solid rgba(15, 23, 42, 0.08);
      border-left: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 2px;
    }
    body.dark .m7-tip__arrow {
      background: #1e293b;
      border-top-color: rgba(148, 163, 184, 0.16);
      border-left-color: rgba(148, 163, 184, 0.16);
    }
    .m7-tip__close {
      width: 20px; height: 20px;
      border: 0; background: transparent; padding: 0;
      color: #94a3b8;
      display: grid; place-items: center;
      border-radius: 50%; cursor: pointer;
      transition: background 120ms ease, color 120ms ease;
    }
    .m7-tip__close:hover { background: rgba(15, 23, 42, 0.06); color: #475569; }
    body.dark .m7-tip__close { color: #94a3b8; }
    body.dark .m7-tip__close:hover { background: rgba(148, 163, 184, 0.18); color: #e2e8f0; }
    .m7-tip__close svg { width: 13px; height: 13px; }

    /* ── First-launch guided tour (app only). The dim is the spotlight's huge
       box-shadow spread, so the .tour layer itself is just a transparent tap-
       catcher; the bubble reuses the .m7-tip glass/slate look. ── */
    .tour {
      position: fixed;
      inset: 0;
      z-index: 2147483000; /* above app chrome; the splash (max int) is gone by now */
      opacity: 0;
      transition: opacity .2s ease;
      font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
      direction: rtl;
    }
    .tour--show { opacity: 1; }

    .tour__spot {
      position: fixed;
      top: 0; left: 0; width: 0; height: 0;
      border-radius: 14px;
      box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.45);
      outline: 2px solid rgba(255, 255, 255, 0.85);
      outline-offset: 0;
      pointer-events: none; /* taps fall through to .tour → advance */
    }
    body.dark .tour__spot {
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.58);
      outline-color: rgba(255, 255, 255, 0.55);
    }
    /* Transition only once shown, so the first placement doesn't fly in from 0,0. */
    .tour--show .tour__spot {
      transition:
        top .3s cubic-bezier(0.16, 1, 0.3, 1), left .3s cubic-bezier(0.16, 1, 0.3, 1),
        width .3s cubic-bezier(0.16, 1, 0.3, 1), height .3s cubic-bezier(0.16, 1, 0.3, 1),
        border-radius .3s ease;
    }

    .tour__bubble {
      position: fixed;
      top: 0; left: 0;
      max-width: min(300px, calc(100vw - 24px));
      background: #f8fafc;
      color: #334155;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 14px;
      padding: 12px 14px 10px;
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.22), 0 2px 8px rgba(15, 23, 42, 0.08);
    }
    body.dark .tour__bubble {
      background: #1e293b;
      color: #cbd5e1;
      border-color: rgba(148, 163, 184, 0.16);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    .tour--show .tour__bubble {
      transition: top .3s cubic-bezier(0.16, 1, 0.3, 1), left .3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tour__text { font-size: 13.5px; font-weight: 600; line-height: 1.75; }
    .tour__actions {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-top: 10px;
    }
    .tour__skip {
      border: 0; background: transparent; color: #64748b;
      font: inherit; font-size: 13px; font-weight: 600;
      padding: 6px 4px; cursor: pointer; border-radius: 8px;
    }
    .tour__skip:hover { color: #334155; }
    body.dark .tour__skip { color: #94a3b8; }
    body.dark .tour__skip:hover { color: #e2e8f0; }
    .tour__next {
      border: 0; border-radius: 10px; cursor: pointer;
      background: #1d8fff; color: #fff;
      font: inherit; font-size: 13px; font-weight: 700;
      padding: 7px 18px;
      box-shadow: 0 2px 8px rgba(29, 143, 255, 0.3);
    }
    @media (hover: hover) { .tour__next:hover { background: #0f7ae6; } }

    @media (prefers-reduced-motion: reduce) {
      .tour, .tour--show .tour__spot, .tour--show .tour__bubble { transition: none; }
    }

    /* ── App-only native-feel lockdown ──────────────────────────────
       Gated to html.is-app (set before first paint by the head script),
       so the website is completely unaffected. This inline copy loads last,
       so it wins the cascade; public/styles.css mirrors it.
       • touch-action: manipulation → no double-tap-to-zoom and no legacy
         300ms tap delay (panning/scrolling unaffected; the viewport meta
         disables pinch-zoom).
       • user-select / -webkit-touch-callout: none → no native text selection
         and no iOS long-press copy/callout bubble anywhere. The custom
         long-press copy menu is pure JS + navigator.clipboard, so it keeps
         working — and is MORE reliable without the native bubble competing.
       • Editable fields opt back in so users can still type/select their own
         input (surah search, ayah number, AI question, feedback form). */
    html.is-app,
    html.is-app body {
      touch-action: manipulation;
    }
    html.is-app,
    html.is-app * {
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    html.is-app input,
    html.is-app textarea,
    html.is-app select,
    html.is-app [contenteditable="true"],
    html.is-app [contenteditable=""] {
      -webkit-user-select: text;
      user-select: text;
    }

    /* ═══════════════════════════════════════════════════════════════════
       Transitions.dev animation pack (Tasks 1, 3–7 + Bug 3)
       ONE home for all the ported animation variables + component classes.
       Variables are merged into the single :root block below (Tasks 3 & 7
       share the panel vars; Task 4 & Bug 3 share the modal vars). Timing
       values / easings / structure match the source snippets; structural
       adaptations are noted inline. JS drivers: src/transitions.js.
       ═══════════════════════════════════════════════════════════════════ */
    :root {
      /* — Input clear with dissolve (Task 1) — */
      --clear-dur: 1000ms;
      --clear-out-dur: 400ms;
      --clear-in-dur: 400ms;
      --clear-out-fly: 12px;
      --clear-in-fly: 12px;
      --clear-out-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --clear-in-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --clear-blur: 2px;
      --glow-delay: 50ms;
      --glow-peak-at: 0.15;
      --glow-opacity: 0.85;
      --glow-spread: 1.5;
      /* Shimmer color (r,g,b): the gallery uses plain ink — black on the
         light theme (multiply darkens), white on dark (screen lightens;
         override below). The per-ellipse alphas (0.14–0.22 in
         transitions.js) carry the subtlety. */
      --clear-glow-rgb: 0, 0, 0;

      /* — Texts reveal (#18) — drives the pick auto-complete: each word
           of the chosen ayah rises into the bar with staggered blur
           (deliberately distinct from the clear's drop-away dissolve) — */
      --stagger-dur: 500ms;
      --stagger-distance: 12px;
      --stagger-stagger: 40ms;
      --stagger-blur: 3px;
      --stagger-ease: cubic-bezier(0.22, 1, 0.36, 1);

      /* — Panel reveal (Tasks 3 + 7) — */
      --panel-open-dur: 400ms;
      --panel-close-dur: 350ms;
      --panel-translate-y: calc(187px * 0.5);
      --panel-blur: 2px;
      --panel-ease: cubic-bezier(0.22, 1, 0.36, 1);

      /* — Tafsir ayah→ayah PURE CROSSFADE (round 5.2: zero movement — the
           outgoing page is snapshotted and simply fades away while the new
           ayah fades in beneath it. All the chrome that is identical
           between pages (buttons, selects, labels) overlaps pixel-exactly,
           so to the eye only the TEXT that actually changes dissolves;
           nothing slides, nothing flies) — */
      --page-swap-out-dur: 200ms;
      --page-swap-in-dur: 220ms;
      /* Entering page: fast-start ease (reaches visibility quickly);
         snapshot fade: gentle symmetric curve. Their crossing keeps
         combined visibility near 1 the whole way — no blank middle, no
         visible dip. */
      --page-swap-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --page-swap-fade-ease: cubic-bezier(0.45, 0, 0.55, 1);

      /* — Modal open/close (Task 4 + Bug 3) — */
      --modal-open-dur: 250ms;
      --modal-close-dur: 150ms;
      --modal-scale: 0.96;
      --modal-scale-close: 0.96;
      --modal-ease: cubic-bezier(0.22, 1, 0.36, 1);

      /* — Text states swap (Task 5) — */
      --text-swap-dur: 150ms;
      --text-swap-translate-y: 4px;
      --text-swap-blur: 2px;
      --text-swap-ease: ease-in-out;

      /* — Success check (Task 6) — */
      --check-opacity-dur: 500ms;
      --check-rotate-dur: 500ms;
      --check-rotate-from: 80deg;
      --check-bob-dur: 500ms;
      --check-y-amount: 40px;
      --check-blur-dur: 500ms;
      --check-blur-from: 10px;
      --check-path-dur: 500ms;
      --check-path-delay: 80ms;
      --check-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --check-ease-opacity: cubic-bezier(0.22, 1, 0.36, 1);
      --check-ease-rotate: cubic-bezier(0.22, 1, 0.36, 1);
      --check-ease-bob: cubic-bezier(0.34, 1.35, 0.64, 1);
      --check-ease-path: cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.dark,
    html.dark body {
      --clear-glow-rgb: 255, 255, 255;
    }

    /* ── Task 1: input clear with dissolve ─────────────────────────────
       Adaptations from the snippet, both required by this pill:
       • NO overflow:hidden on .t-clear — it would clip the input's focus
         ring and the surah-selector dropdown that lives inside the pill.
         Each layer self-clips with the pill's 18px radius instead.
       • The fake placeholder only renders DURING the clear (base opacity 0,
         JS drives the fly-in); the native placeholder keeps serving the
         everyday empty state, and is hidden while .is-clearing so the two
         never double-paint during the handoff. */
    .t-clear {
      position: relative;
    }

    .t-clear-mirror,
    .t-clear-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      z-index: 2;
      border-radius: 18px;
      color: var(--text);
    }

    .t-clear-mirror {
      opacity: 0;
      /* Cluster-aware fade (round 4 rework of Fix 4b): full opacity from
         the RTL reading start, easing out across a fixed 130px ramp that
         ENDS — at exactly alpha 0 — on the surah selector's right edge.
         --search-actions-w is the cluster's LIVE footprint (offsetLeft +
         width, ResizeObserver-maintained in app.js), so the fade tracks
         the selector as its label changes width and nothing ever bleeds
         under or behind it. Fixed-px stops replace the old %-based ones,
         which scaled with the pill: on a wide pill they dimmed half the
         bar prematurely AND still left the tail readable at ~30-50% alpha
         behind the selector (the reported bug). The mask lives on this
         wrapper; swaps animate inner spans so they never fight it.
         -webkit- prefix is the one WKWebView needs; both set for parity. */
      --clear-fade-end: calc(var(--search-actions-w, 60px) + 6px);
      -webkit-mask-image: linear-gradient(to left,
          #000 0,
          #000 calc(100% - var(--clear-fade-end) - 130px),
          rgba(0, 0, 0, 0.45) calc(100% - var(--clear-fade-end) - 60px),
          transparent calc(100% - var(--clear-fade-end)),
          transparent 100%);
      mask-image: linear-gradient(to left,
          #000 0,
          #000 calc(100% - var(--clear-fade-end) - 130px),
          rgba(0, 0, 0, 0.45) calc(100% - var(--clear-fade-end) - 60px),
          transparent calc(100% - var(--clear-fade-end)),
          transparent 100%);
    }

    .t-clear.has-value .t-clear-mirror,
    .t-clear.is-previewing .t-clear-mirror,
    .t-clear.is-clearing .t-clear-mirror {
      opacity: 1;
    }

    .t-clear.has-value > input,
    .t-clear.is-previewing > input,
    .t-clear.is-clearing > input,
    .t-clear.is-materializing > input {
      -webkit-text-fill-color: transparent;
    }

    /* Locked-state tint: once an ayah is locked into the bar the surface
       SLOWLY shifts color so the lock reads at a glance; clicking the bar
       un-tints just as slowly while the dissolve clears the text. The
       transition lives on the input itself so both directions ease. */
    #textSearch {
      transition: background-color 700ms ease, border-color 700ms ease,
        box-shadow .15s ease;
    }

    .t-clear.has-value > input {
      background-color: rgba(14, 165, 233, 0.08);
      border-color: rgba(56, 189, 248, 0.40);
    }

    /* Dark locked state: grey "locked" treatment drawn FROM the theme's
       own palette — the surface is the resting input's exact hue family
       (rgba(34,40,48) = --card2 / .input-glass dark) stepped one shade
       deeper, and the edge is the dark theme's standard border grey
       rgba(148,163,184) (used at .18–.22 everywhere) nudged to .30 so the
       state reads. Nothing foreign, nothing blue, nothing light.
       !important: the dark theme repaints Tailwind's bg-white/* utilities
       with `background: … !important` (the big body.dark override block),
       which would otherwise swallow the tint. Light theme unchanged. */
    body.dark .t-clear.has-value > input,
    html.dark .t-clear.has-value > input {
      background-color: rgba(26, 31, 38, 0.92) !important;
      border-color: rgba(148, 163, 184, 0.30) !important;
    }

    /* ISSUE 3: switching theme must not animate the pill's colors — the
       locked-tint transition above (700ms background/border) plus the
       beam layers' transition:all lerped between the two palettes and
       read as a glow on every toggle. toggleDarkMode() (src/app.js)
       holds this class on <html> for the swap frames; the slow tint
       keeps animating for actual lock/unlock interactions. */
    html.m7-theme-switching #textSearch,
    html.m7-theme-switching .border-beam,
    html.m7-theme-switching .border-beam *,
    html.m7-theme-switching .border-beam::before,
    html.m7-theme-switching .border-beam::after {
      transition: none !important;
    }

    .t-clear.is-clearing > input::placeholder {
      color: transparent !important;
    }

    .t-clear-placeholder {
      opacity: 0;
      /* Same formula Tailwind's preflight gives the native placeholder. */
      color: color-mix(in oklab, var(--text) 50%, transparent);
    }

    .t-clear.has-value .t-clear-placeholder,
    .t-clear.is-previewing .t-clear-placeholder {
      opacity: 0;
    }

    /* ── Lock veil: the lock sits ABOVE the text ────────────────────────
       A grey in-palette sheet over the locked ayah (under the cluster's
       z-4 controls) so the bar genuinely reads as locked. It rides the
       same slow 700ms motion as the tint: in on lock, out on the unlock
       click — the text "comes back into appearance" as the veil lifts.
       Only .has-value (an actually chosen ayah) raises it — never the
       selector's browsing preview (.is-previewing). */
    .t-clear-veil {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      border-radius: 18px;
      opacity: 0;
      background: rgba(241, 245, 249, 0.55);
      transition: opacity 700ms ease;
    }

    .t-clear.has-value .t-clear-veil {
      opacity: 1;
    }

    /* The moment a dissolve starts (unlock click or مسح), the veil lifts
       so the text's disappearance plays at full contrast — not dimmed
       under the lock sheet. Wins over the has-value rule above. */
    .t-clear.is-clearing .t-clear-veil {
      opacity: 0;
    }

    body.dark .t-clear-veil,
    html.dark .t-clear-veil {
      background: rgba(26, 31, 38, 0.60);
    }

    @media (prefers-reduced-motion: reduce) {
      .t-clear-veil {
        transition: none !important;
      }
    }

    .t-clear-mirror .t-clear-word {
      display: inline-block;
    }

    /* ── Texts reveal (#18): the pick auto-complete ─────────────────────
       materializeSearchText() stages .is-revealing (+ .is-staging for the
       no-transition commit), writes each word's stagger as an inline
       transition-delay, then flips .is-shown — every word rises into
       view, unblurring, in reading order. Removal stays the dissolve;
       this entrance is its deliberate opposite. */
    .t-clear-mirror.is-revealing .t-clear-word {
      opacity: 0;
      transform: translateY(var(--stagger-distance));
      filter: blur(var(--stagger-blur));
      transition:
        opacity var(--stagger-dur) var(--stagger-ease),
        transform var(--stagger-dur) var(--stagger-ease),
        filter var(--stagger-dur) var(--stagger-ease);
    }

    .t-clear-mirror.is-revealing.is-staging .t-clear-word {
      transition: none !important;
    }

    .t-clear-mirror.is-revealing.is-shown .t-clear-word {
      opacity: 1;
      transform: none;
      filter: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .t-clear-mirror.is-revealing .t-clear-word {
        transition: none !important;
        opacity: 1;
        transform: none;
        filter: none;
      }
    }

    /* Whitespace between words must be its own flex item — flex containers
       drop whitespace-only TEXT NODES entirely. pre keeps the run intact. */
    .t-clear-mirror .t-clear-space {
      white-space: pre;
    }

    /* Round 3: the selector reflection renders the AYAH TEXT as one
       swappable line inside the mirror. The double selector keeps the flex
       layout even while swapText/swapBlock add their .t-text-swap display
       classes — the swap's translateY/blur animates the line as a unit
       while the gradient mask stays on the parent mirror. */
    .t-clear-mirror .t-clear-line,
    .t-clear-mirror .t-clear-line.t-text-swap {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }

    .t-clear-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      z-index: 3;
      mix-blend-mode: multiply;
      border-radius: 18px;
      /* Same mask as the mirror: streaks are hard-limited to the
         observable text — nothing can glow over the selector cluster or
         past the fade. (The JS painter also skips invisible words and
         attenuates through the ramp; this is the visual guarantee.) */
      --clear-fade-end: calc(var(--search-actions-w, 60px) + 6px);
      -webkit-mask-image: linear-gradient(to left,
          #000 0,
          #000 calc(100% - var(--clear-fade-end) - 130px),
          rgba(0, 0, 0, 0.45) calc(100% - var(--clear-fade-end) - 60px),
          transparent calc(100% - var(--clear-fade-end)),
          transparent 100%);
      mask-image: linear-gradient(to left,
          #000 0,
          #000 calc(100% - var(--clear-fade-end) - 130px),
          rgba(0, 0, 0, 0.45) calc(100% - var(--clear-fade-end) - 60px),
          transparent calc(100% - var(--clear-fade-end)),
          transparent 100%);
    }

    body.dark .t-clear-glow,
    html.dark .t-clear-glow {
      mix-blend-mode: screen;
    }

    @media (prefers-reduced-motion: reduce) {
      .t-clear-glow {
        opacity: 0 !important;
      }
    }

    /* ── Tasks 3 + 7: panel reveal ──────────────────────────────────────
       data-open drives it; JS sets --panel-translate-y to ~50% of the real
       panel height (capped — see transitions.js). The OPEN state uses
       none-values for transform/filter (visually identical to translateY(0)
       / blur(0)) so an open panel never becomes a containing block for
       position:fixed descendants (fullscreen chrome, dropdowns). */
    .t-panel-slide {
      transform: translateY(var(--panel-translate-y));
      opacity: 0;
      filter: blur(var(--panel-blur));
      pointer-events: none;
      transition:
        transform var(--panel-close-dur) var(--panel-ease),
        opacity var(--panel-close-dur) var(--panel-ease),
        filter var(--panel-close-dur) var(--panel-ease);
    }

    .t-panel-slide[data-open="true"] {
      transform: none;
      opacity: 1;
      filter: none;
      pointer-events: auto;
      transition:
        transform var(--panel-open-dur) var(--panel-ease),
        opacity var(--panel-open-dur) var(--panel-ease),
        filter var(--panel-open-dur) var(--panel-ease);
    }

    /* Fullscreen Mushaf: the root is a fixed surface with fixed chrome
       children — panel-slide must be fully inert there (transform/filter/
       transition would re-anchor the fixed chrome / fight the lock). */
    .mushaf-root--fullscreen.t-panel-slide,
    .mushaf-root--fullscreen.t-panel-slide[data-open="true"] {
      transform: none !important;
      filter: none !important;
      opacity: 1 !important;
      transition: none !important;
      pointer-events: auto !important;
    }

    @media (prefers-reduced-motion: reduce) {
      .t-panel-slide {
        transition: none !important;
      }
    }

    /* ── Round 5.2: Tafsir ayah→ayah PURE CROSSFADE ─────────────────────
       softSwapTafsir() in src/app.js clones the outgoing page into an
       absolutely-positioned snapshot (.t-page-ghost), applies the new
       ayah BEHIND it (the screen keeps painting the identical clone while
       the heavy DOM work runs — no blank frame ever), then the snapshot
       fades away while the live page fades in. Opacity ONLY — no
       translate, no blur, no height choreography: chrome that is
       identical between pages overlaps pixel-exactly, so the eye sees
       just the changed text dissolve. Cheapest composite in WKWebView. */
    #tafsirPages {
      position: relative;
    }

    /* Clip a taller outgoing snapshot to the panel's new height. */
    #tafsirPages.is-swapping {
      overflow: hidden;
    }

    .t-page-ghost {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1;
      pointer-events: none;
      transition: opacity var(--page-swap-out-dur) var(--page-swap-fade-ease);
    }

    .t-page-ghost.is-out {
      opacity: 0;
    }

    #tafsirPageCurrent {
      transition: opacity var(--page-swap-in-dur) var(--page-swap-ease);
    }

    /* Staged by JS the same frame the new content applies — invisible,
       NO transition; removing this class is what fades it in. */
    #tafsirPageCurrent.t-page-enter {
      opacity: 0;
      transition: none;
    }

    @media (prefers-reduced-motion: reduce) {
      #tafsirPageCurrent {
        transition: none !important;
      }

      .t-page-ghost {
        display: none !important;
      }
    }

    /* ── Task 4 + Bug 3: modal open/close ───────────────────────────── */
    .t-modal {
      transform-origin: center;
      transform: scale(var(--modal-scale));
      opacity: 0;
      pointer-events: none;
      transition:
        transform var(--modal-open-dur) var(--modal-ease),
        opacity var(--modal-open-dur) var(--modal-ease);
      will-change: transform, opacity;
    }

    .t-modal.is-open {
      transform: scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .t-modal.is-closing {
      transform: scale(var(--modal-scale-close));
      opacity: 0;
      pointer-events: none;
      transition:
        transform var(--modal-close-dur) var(--modal-ease),
        opacity var(--modal-close-dur) var(--modal-ease);
    }

    @media (prefers-reduced-motion: reduce) {
      .t-modal {
        transition: none !important;
      }
    }

    /* ── Task 5: text states swap ─────────────────────────────────────── */
    .t-text-swap {
      display: inline-block;
      transform: translateY(0);
      filter: blur(0);
      opacity: 1;
      transition:
        transform var(--text-swap-dur) var(--text-swap-ease),
        filter var(--text-swap-dur) var(--text-swap-ease),
        opacity var(--text-swap-dur) var(--text-swap-ease);
      will-change: transform, filter, opacity;
    }

    /* Block variant for whole-status swaps in the offline sheet rows. */
    .t-text-swap--block {
      display: block;
    }

    .t-text-swap.is-exit {
      transform: translateY(calc(var(--text-swap-translate-y) * -1));
      filter: blur(var(--text-swap-blur));
      opacity: 0;
    }

    .t-text-swap.is-enter-start {
      transform: translateY(var(--text-swap-translate-y));
      filter: blur(var(--text-swap-blur));
      opacity: 0;
      transition: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .t-text-swap {
        transition: none !important;
      }
    }

    /* ── Task 6: success check (copy confirmation) ───────────────────── */
    .t-success-check {
      display: inline-block;
      transform-origin: center;
      opacity: 0;
      will-change: transform, opacity, filter;
    }

    .t-success-check svg {
      display: block;
      overflow: visible;
    }

    .t-success-check svg path {
      stroke-dasharray: 20;
      stroke-dashoffset: 20;
    }

    .t-success-check[data-state="in"] {
      animation:
        t-check-fade var(--check-opacity-dur) var(--check-ease-opacity) forwards,
        t-check-rotate var(--check-rotate-dur) var(--check-ease-rotate) forwards,
        t-check-blur var(--check-blur-dur) var(--check-ease-out) forwards,
        t-check-bob var(--check-bob-dur) var(--check-ease-bob) forwards;
    }

    .t-success-check[data-state="in"] svg path {
      animation: t-check-draw var(--check-path-dur) var(--check-ease-path) var(--check-path-delay, 0ms) forwards;
    }

    @keyframes t-check-fade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes t-check-rotate {
      from {
        transform: rotate(var(--check-rotate-from));
      }

      to {
        transform: rotate(0deg);
      }
    }

    @keyframes t-check-blur {
      from {
        filter: blur(var(--check-blur-from));
      }

      to {
        filter: blur(0);
      }
    }

    @keyframes t-check-bob {
      from {
        translate: 0 var(--check-y-amount);
      }

      to {
        translate: 0 0;
      }
    }

    @keyframes t-check-draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .t-success-check {
        animation: none !important;
        opacity: 1;
      }

      .t-success-check svg path {
        animation: none !important;
        stroke-dashoffset: 0 !important;
      }
    }

    /* The copy toast holds the bobbing check (40px travel) — clip it so the
       bob never paints outside the pill while still letting the check own
       the toast's vertical center. */
    .copy-toast .t-success-check svg {
      width: 22px;
      height: 22px;
    }

    /* ── Round 2, Fix 5: frozen top bar ────────────────────────────────
       position:sticky verifies pinned in desktop Chrome (no overflow/
       transform ancestor breaks it in this codebase) — but on the device
       WKWebView's rubber-band drags sticky elements with the bounce
       (overscroll-behavior is unreliable there, and this codebase has a
       documented history of WebKit scroll-state staleness around the
       fullscreen body lock). position:fixed is immune to both. The body
       padding-top below re-reserves exactly the header's flow space (JS
       measures the real height into --m7-header-h, incl. the app's
       safe-area padding), so there is zero layout shift; scroll-padding
       keeps scrollIntoView targets from tucking under the bar. The
       fullscreen lock is untouched: a fixed header coexists with the
       body position:fixed lock, and the Mushaf fullscreen surface
       (z-index 1000) still covers the bar (z-40). */
    header.site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
    }

    body {
      padding-top: var(--m7-header-h, 64px);
    }

    html.is-app body {
      padding-top: var(--m7-header-h,
          calc(64px + max(env(safe-area-inset-top, 0px), var(--m7-statusbar-height, 24px))));
    }

    html {
      scroll-padding-top: calc(var(--m7-header-h, 64px) + 8px);
      /* مسح zero-shift: when the tafsir panel collapses the page can get
         shorter than the viewport — a vanishing scrollbar would shift the
         whole centered layout sideways. Reserve the gutter permanently
         (no-op on overlay-scrollbar platforms incl. the app's WebView). */
      scrollbar-gutter: stable;
    }

    /* ── Round 2, Fix 4d: surah selector must never sink ───────────────
       The pill's dropdown lives inside #searchPanel (z-30), which sits
       below the frozen header (z-40) by design — so a scrolled-up pill
       would slide its open dropdown UNDER the bar. While the dropdown is
       open, mushaf.js raises the panel above the header (and any panel
       chrome); closed, the normal stacking returns. */
    #searchPanel.surah-dd-raised {
      z-index: 70;
    }

    /* ── Round 2, Fix 2: app-only static splash cover ───────────────────
       Painted on the literal first frame (initial HTML + html.is-app set
       in <head>), before any JS runs — the bare app can never flash.
       Colors MUST stay in sync with src/splash.js (LIGHT_BG / DARK_BG)
       and the native launch screen. src/splash.js adopts this node. */
    #m7-splash {
      display: none;
    }

    html.is-app #m7-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eff5ff;
      touch-action: none;
    }

    html.is-app.dark #m7-splash {
      background: #1f252e;
    }

    /* ═══════ TEST — Mushaf ayah faux-bold (Option 2) — DELETE THIS BLOCK TO REVERT ═══════
       Thin synthetic bold on ayah TEXT ONLY, app-only (authoritative copy; this
       inline <style> loads last so it wins). -webkit-text-stroke is paint-only
       (no glyph-metric change), so it canNOT break the nowrap exact-page layout —
       only the visual diacritic thickness is being judged. paint-order:stroke
       draws the stroke UNDER the fill so glyph counters stay open. Scope excludes
       ayah numbers (.mushaf-end), bismillah (outside .mushaf-ayah), surah headers,
       and all UI. Mirrored in public/styles.css + public/mushaf.css. Isolated from
       commit b4004e5 — to revert, delete this block in all three files (then
       optionally apply Option 3, darker ayah text). */
    html.is-app .mushaf-ayah .mushaf-word:not(.mushaf-end) {
      -webkit-text-stroke: 0.25px currentColor;
      paint-order: stroke;
    }
    /* ═══════ END TEST block ═══════ */
  </style>
</head>

<body>
  <!-- App-only opening splash — STATIC first-frame cover (Fix 2). The old
       overlay was built by JS inside a dynamically-imported chunk, so the
       WebView painted the bare app for a few frames before it mounted.
       This placeholder is plain initial HTML: html.is-app is set by the
       <head> script BEFORE the body parses, so inside the app the very
       first paint is this solid surface (matching the native launch screen
       AND the Lottie's frame-0 background — both handoffs invisible).
       src/splash.js ADOPTS this node (data-adopted) and runs the Lottie +
       fade-out lifecycle on it; the inline timer below is a last-resort
       escape if app JS never boots. display:none on the website. -->
  <div id="m7-splash" aria-hidden="true"></div>
  <!-- One shared blurred dim behind every sheet; shown via body.offline-sheet-open. -->
  <div class="sheet-scrim" aria-hidden="true"></div>
  <script>
    (function () {
      if (!document.getElementById("m7-splash")) return;
      setTimeout(function () {
        var s = document.getElementById("m7-splash");
        if (s && s.dataset.adopted !== "1" && s.parentNode) s.parentNode.removeChild(s);
      }, 8000);
    })();
  </script>

  <!-- Minimal top bar (frozen — position:fixed via CSS, Fix 5) -->
  <header class="site-header top-0 z-40 border-b border-black/5">
    <div class="mx-auto max-w-5xl px-4 py-3 flex items-center justify-between gap-2">
      <!-- App-only settings hub (offline downloads + feedback + toggles live
           inside its sheet). Empty wrapper on the website — the button starts
           display:none and settings-panel.js reveals it behind isApp(). -->
      <div class="header-app-actions">
        <button id="settingsMenuBtn" type="button" class="offline-menu-btn"
          style="display:none;" aria-label="إعدادات">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9 1.65 1.65 0 0 0 4.27 7.18l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
      <!-- RTL: #netBadge precedes the button so it renders to its RIGHT,
           keeping the theme toggle flush at the header's left edge. -->
      <div class="flex items-center gap-3">
        <div id="netBadge" class="hidden">بدون إنترنت</div>
        <button id="themeToggle" type="button"
          class="theme-toggle px-4 py-2 rounded-2xl border shadow-sm font-extrabold text-sm">فاتح</button>
      </div>
      <span id="themeLabel" class="sr-only">theme</span>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4">
    <!-- Hero / Manual search -->
    <section class="pt-14 pb-10 text-center">
      <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-slate-900">محمديات</h1>
      <p class="mt-3 text-slate-500 font-semibold">علمٌ يُحمد، وأثرٌ يُذكر</p>

      <div class="mt-8 mx-auto max-w-2xl text-center">
        <div class="glass rounded-3xl p-4" id="searchPanel">
          <div class="relative border-beam t-clear" data-active>
            <input id="textSearch"
              class="input-glass w-full bg-white/70 border border-slate-900/10 rounded-2xl px-10 py-4 outline-none focus:ring-4 focus:ring-blue-500/10 transition"
              placeholder="اكتب حرفين فأكثر من آية..." />
            <!-- Input clear with dissolve (Transitions.dev): the mirror
                 visualizes the LOCKED ayah text (the real input text goes
                 transparent while locked), the placeholder layer flies in
                 during the مسح dissolve, and the glow layer hosts the
                 per-word streaks. All three self-clip to the pill radius;
                 app.js owns the locking + the per-frame clear routine. -->
            <div class="t-clear-mirror" id="searchClearMirror" aria-hidden="true"></div>
            <div class="t-clear-placeholder" id="searchClearPlaceholder" aria-hidden="true"></div>
            <div class="t-clear-glow" id="searchClearGlow" aria-hidden="true"></div>
            <!-- Lock veil: a grey sheet ABOVE the locked ayah text so the
                 state reads as locked; fades with the 700ms lock motion. -->
            <div class="t-clear-veil" id="searchClearVeil" aria-hidden="true"></div>
            <!-- Left-corner action cluster: مسح + the surah selector (which
                 mushaf.js relocates here from its toolbar at shell-build
                 time; both visible in both modes). RTL ⇒ the cluster sits
                 at the pill's left end, with مسح on the selector's RIGHT
                 (first in DOM = rightmost in RTL flex). مسح starts hidden
                 and fades into existence once an ayah is selected — the
                 old selected-ayah chip card it used to ride on is gone. -->
            <div id="searchPillActions" class="absolute left-3 top-1/2 -translate-y-1/2 flex items-center gap-2">
              <!-- Rewind-to-start icon (was the text "مسح"): one glance =
                   "take everything back to the beginning". Same id/classes —
                   all behavior unchanged. -->
              <button type="button" id="clearBtn" class="pill-clear-btn"
                title="العودة إلى البداية" aria-label="مسح والعودة إلى الصفحة الرئيسية">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                  <path d="M3 3v5h5" />
                </svg>
              </button>
            </div>
            <div data-beam-bloom aria-hidden="true"></div>
          </div>
          <div id="indexStatus" class="mt-2 text-xs font-bold text-slate-500 text-center hidden" aria-live="polite">
          </div>

          <!-- Mode toggle (Tafsir ↔ Mushaf). Wired by mushaf.js -->
          <div id="modeToggleSearchPanel" class="mode-toggle--in-search">
            <div class="mode-toggle">
              <button type="button" class="mode-toggle__btn" data-mode-toggle aria-label="التبديل بين تفسير وتدبّر">
                <span class="mode-toggle__knob"></span>
                <span class="mode-toggle__labels">
                  <span class="mode-toggle__label mode-toggle__label--tafsir">تفسير</span>
                  <span class="mode-toggle__label mode-toggle__label--mushaf">تدبّر</span>
                </span>
              </button>
            </div>
          </div>

          <!-- Results area (IDs preserved). The selected-ayah chip card that
               used to live here is REMOVED — selection now shows as the
               locked ayah text in the pill itself, and مسح moved up into
               the pill's action cluster. -->
          <div class="results-shell mt-3 collapsed is-empty" id="resultsShell">
            <div
              class="results results-list mt-3 rounded-2xl overflow-hidden border border-slate-900/10 bg-white/50 is-empty collapsed"
              id="results" style="max-height:480px; overflow:auto;"></div>
          </div>
        </div>
        <div class="mt-6">
          <div class="mx-auto max-w-4xl">
            <div id="tafsirSection" class="glass hidden rounded-3xl p-6 t-panel-slide" data-open="false">
              <!-- Round 5.2: #tafsirPageCurrent is the ayah→ayah crossfade
                   target — softSwapTafsir (src/app.js) overlays a cloned
                   snapshot (.t-page-ghost) inside #tafsirPages and the two
                   layers purely cross-fade (opacity only). Plain flow
                   content at rest. -->
              <div id="tafsirPages">
              <div id="tafsirPageCurrent">
              <!-- App-only "audio needs internet" notice (top of the tab) -->
              <div id="tafsirAudioMsg" class="tafsir-audio-msg" aria-live="polite" hidden></div>
              <!-- Controls layout: tafsir menu up, compare centered, nav centered -->
              <div class="w-full tafsir-top-row">
                <div class="w-full sm:w-auto text-right tafsir-meta">
                  <div id="tafsirHeader" class="text-xs font-extrabold text-slate-500">اختر آية من نتائج البحث</div>
                  <div id="tafsirTitleRow" class="tafsir-title-row mt-2">
                    <div id="tafsirTitle" class="text-xl font-extrabold tracking-tight">&mdash;</div>
                    <button type="button" id="tafsirDescBtn" class="tafsir-desc-btn" aria-label="عن هذا التفسير"
                      aria-expanded="false">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M12 16v-4" />
                        <path d="M12 8h.01" />
                      </svg>
                    </button>
                    <div id="tafsirDesc" class="tafsir-desc-pop" role="tooltip" aria-hidden="true">&mdash;</div>
                  </div>
                  <div id="tafsirMetaAyah" class="hidden mt-2 text-xs font-bold text-slate-500">&mdash;</div>
                </div>
                <div class="w-full sm:w-auto tafsir-controls">
                  <!-- Audio toolbar: settings cog + play button (Mushaf-style) -->
                  <div class="mushaf-toolbar tafsir-audio-toolbar" id="tafsirAudioToolbar">
                    <div class="mushaf-toolbar__btn-wrap" id="tafsirSettingsWrap" data-tafsir-settings-wrap>
                      <button type="button" class="mushaf-toolbar__btn mushaf-toolbar__btn--settings"
                        data-tafsir-settings-btn aria-label="إعدادات الصوت">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                          stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9 1.65 1.65 0 0 0 4.27 7.18l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                        </svg>
                      </button>
                      <div class="mushaf-toolbar__dropdown mushaf-toolbar__dropdown--settings"
                        data-tafsir-settings-dropdown>
                        <div class="mushaf-settings__section">
                          <div class="mushaf-settings__label">القارئ</div>
                          <div class="mushaf-settings__row mushaf-settings__row--pills" data-tafsir-settings="reciter">
                          </div>
                        </div>
                        <div class="mushaf-settings__section">
                          <div class="mushaf-settings__label">طريقة التشغيل</div>
                          <div class="mushaf-settings__row" data-tafsir-settings="audio-mode">
                            <button type="button" class="mushaf-settings__chip" data-val="continuous">تشغيل متواصل</button>
                            <button type="button" class="mushaf-settings__chip" data-val="single">آية واحدة</button>
                          </div>
                        </div>
                        <div class="mushaf-settings__section" data-repeat-section>
                          <div class="mushaf-settings__label">تكرار الآية</div>
                          <div class="mushaf-settings__row" data-tafsir-settings="repeat">
                            <button type="button" class="mushaf-settings__chip" data-val="1">بدون تكرار</button>
                            <button type="button" class="mushaf-settings__chip" data-val="inf">تكرار</button>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div class="mushaf-toolbar__btn-wrap" id="tafsirPlayWrap">
                      <button type="button" class="mushaf-toolbar__btn mushaf-toolbar__btn--play" id="tafsirPlayBtn"
                        data-playing="false" aria-label="تشغيل/إيقاف">
                        <svg id="tafsirPlayIcon" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                          <path d="M7 4.5v15a.75.75 0 0 0 1.15.633l12-7.5a.75.75 0 0 0 0-1.266l-12-7.5A.75.75 0 0 0 7 4.5z" />
                        </svg>
                        <svg id="tafsirPauseIcon" class="hidden" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                          <rect x="6" y="4.5" width="4" height="15" rx="1" /><rect x="14" y="4.5" width="4" height="15"
                            rx="1" />
                        </svg>
                      </button>
                      <div class="mushaf-toolbar__dropdown mushaf-toolbar__dropdown--volume" id="tafsirVolDropdown">
                        <div class="mushaf-settings__section" data-volume-section>
                          <div class="mushaf-settings__label">مستوى الصوت</div>
                          <div class="mushaf-toolbar__vol-row">
                            <button type="button" class="mushaf-toolbar__vol-btn" id="tafsirVolDown" aria-label="خفض"><svg
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M19.5 12h-15" />
                              </svg></button>
                            <input type="range" id="tafsirVolSlider" min="0" max="100" value="80"
                              class="mushaf-toolbar__slider">
                            <button type="button" class="mushaf-toolbar__vol-btn" id="tafsirVolUp" aria-label="رفع"><svg
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 4.5v15m7.5-7.5h-15" />
                              </svg></button>
                          </div>
                        </div>
                        <div class="mushaf-settings__section" style="margin-top: 4px;">
                          <div class="mushaf-settings__label">السرعة</div>
                          <div class="mushaf-toolbar__vol-row" style="gap: 8px;">
                            <button type="button" class="mushaf-settings__chip" id="tafsirSpeedBtn"
                              style="min-width: 3.5rem; padding: 0.25rem 0.5rem; flex-shrink: 0;"
                              aria-label="تغيير السرعة">1x</button>
                            <input type="range" id="tafsirSpeedSlider" min="0.5" max="2" step="0.05" value="1"
                              class="mushaf-toolbar__slider">
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="tafsir-actions">
                  <!-- BorderBeam pulse-outside wrapper (ocean, strength 0.5).
                       The glow layers live on this span (::before/::after +
                       the bloom child) so the opaque button covers the inner
                       part and only the outward halo shows. Activated by
                       src/pulse-beam.js while the button is enabled. -->
                  <span class="mukhtasar-beam" data-beam="mukhtasar">
                  <button type="button" id="compareTafsirsBtn" disabled
                    class="w-full px-4 py-3 rounded-2xl bg-blue-600 text-white font-extrabold text-sm hover:opacity-90 transition disabled:opacity-60 disabled:cursor-not-allowed tafsir-compare-btn flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                      style="width:16px;height:16px;flex-shrink:0;">
                      <path fill-rule="evenodd"
                        d="M9 4.5a.75.75 0 01.721.544l.813 2.846a3.75 3.75 0 002.576 2.576l2.846.813a.75.75 0 010 1.442l-2.846.813a3.75 3.75 0 00-2.576 2.576l-.813 2.846a.75.75 0 01-1.442 0l-.813-2.846a3.75 3.75 0 00-2.576-2.576l-2.846-.813a.75.75 0 010-1.442l2.846-.813A3.75 3.75 0 007.466 7.89l.813-2.846A.75.75 0 019 4.5zM18 1.5a.75.75 0 01.728.568l.258 1.036c.236.94.97 1.674 1.91 1.91l1.036.258a.75.75 0 010 1.456l-1.036.258c-.94.236-1.674.97-1.91 1.91l-.258 1.036a.75.75 0 01-1.456 0l-.258-1.036a2.625 2.625 0 00-1.91-1.91l-1.036-.258a.75.75 0 010-1.456l1.036-.258a2.625 2.625 0 001.91-1.91l.258-1.036A.75.75 0 0118 1.5zM16.5 15a.75.75 0 01.712.513l.394 1.183c.15.447.5.799.948.948l1.183.395a.75.75 0 010 1.422l-1.183.395c-.447.15-.799.5-.948.948l-.395 1.183a.75.75 0 01-1.422 0l-.395-1.183a1.5 1.5 0 00-.948-.948l-1.183-.395a.75.75 0 010-1.422l1.183-.395c.447-.15.799-.5.948-.948l.395-1.183A.75.75 0 0116.5 15z"
                        clip-rule="evenodd" />
                    </svg>
                    مختصر التفاسير
                  </button>
                  <span data-beam-bloom aria-hidden="true"></span>
                  </span>
                  <span class="tafsir-actions__divider" aria-hidden="true"></span>
                  <div class="w-full sm:w-auto flex justify-center tafsir-select-wrap">
                    <select id="tafsirSelect"
                      class="w-full bg-white/70 border border-slate-900/10 rounded-2xl px-1 py-3 text-sm font-bold outline-none focus:ring-4 focus:ring-blue-500/10 transition tafsir-select">
                      <option value="muyassar">التفسير الميسّر</option>
                      <option value="saadi">تفسير السعدي</option>
                      <option value="tabari">تفسير الطبري</option>
                      <option value="ibn_kathir">تفسير ابن كثير</option>
                      <option value="qurtubi">تفسير القرطبي</option>
                      <option value="baghawi">تفسير البغوي</option>
                      <option value="ibn_ashur">تفسير ابن عاشور</option>
                    </select>
                  </div>
                  </div>
                </div>
              </div>
              <div class="mt-6">
                <div id="tafsirComparePanel" class="mt-6 hidden" aria-hidden="true">
                  <div class="rounded-3xl border border-slate-900/10 bg-white/60 p-5">
                    <div class="compare-header-row flex items-center justify-between gap-3 flex-wrap"
                      style="cursor: pointer;">
                      <div class="text-sm font-extrabold text-slate-700 flex items-center gap-2">
                        <span>مقارنة بين التفاسير</span>
                        <svg id="compareToggleIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                          stroke-width="2.5" stroke="currentColor"
                          style="width:14px;height:14px;transition:transform 0.25s ease;">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                        </svg>
                      </div>
                      <div class="flex items-center gap-2">
                        <button type="button" id="compareWritePauseBtn"
                          class="hidden px-3 py-1.5 rounded-xl text-xs font-extrabold bg-amber-500/10 text-amber-700 hover:bg-amber-500/20 transition">إيقاف</button>
                        <button type="button" id="compareStopBtn"
                          class="hidden px-3 py-1.5 rounded-xl text-xs font-extrabold bg-slate-900/5 hover:bg-slate-900/10 transition">إيقاف</button>
                        <button type="button" id="compareCloseBtn"
                          class="px-3 py-1.5 rounded-xl text-xs font-extrabold bg-slate-900/5 hover:bg-slate-900/10 transition">إغلاق</button>
                      </div>
                    </div>

                    <div id="tafsirCompareStatus" class="mt-3 text-sm font-semibold text-slate-500" aria-live="polite">
                      <span class="inline-flex items-center gap-2">
                        <span id="tafsirCompareSpinner"
                          class="hidden inline-block h-4 w-4 rounded-full border-2 border-slate-300 border-t-slate-700 animate-spin"></span>
                        <span id="tafsirCompareStatusText"></span>
                      </span>
                    </div>

                    <div class="compare-scroll mt-4">
                      <div id="tafsirCompareContent" class="text-[15px] leading-7 text-slate-800"></div>
                    </div>
                  </div>
                </div>

                <div class="mt-8 flex items-center justify-between gap-4 w-full">
                  <button type="button" id="prevAyahBtn" class="ayah-nav-btn group" aria-label="الآية السابقة">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                      stroke="currentColor" class="w-6 h-6 ml-0.5 transition-transform group-hover:translate-x-1">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                    </svg>
                  </button>

                  <div class="flex-1 px-2 text-center">
                    <div id="tafsirBasmala" class="quran-font text-center text-lg font-bold text-slate-700 hidden mb-4">
                    </div>
                    <div id="tafsirAyahTag"
                      class="quran-font text-2xl sm:text-3xl leading-[2.4] text-slate-900 transition-all text-center">—
                    </div>
                  </div>

                  <button type="button" id="nextAyahBtn" class="ayah-nav-btn group" aria-label="الآية التالية">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                      stroke="currentColor" class="w-6 h-6 mr-0.5 transition-transform group-hover:-translate-x-1">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                    </svg>
                  </button>
                </div>

                <div id="tafsirBox"
                  class="mt-6 rounded-3xl border border-slate-900/10 bg-white/65 p-5 leading-[2.2] text-[18px] text-slate-900"
                  style="max-height:520px; overflow:auto;">—</div>


              </div>

              <div class="mt-6">
                <!-- Small centred section divider (theme-aware via --line) -->
                <div aria-hidden="true" style="width:96px; height:2px; border-radius:999px; background:var(--line); margin:0 auto 18px;"></div>
                <div class="flex items-center gap-2" style="justify-content:center;">
                  <select id="langSelect"
                    class="bg-white/70 border border-slate-900/10 rounded-2xl px-4 py-2 text-sm font-bold outline-none focus:ring-4 focus:ring-blue-500/10 transition">
                    <option value="en" selected>English</option>
                    <option value="both">English + العربية</option>
                  </select>
                  <button type="button" id="toggleVersesBtn" aria-expanded="false"
                    class="px-4 py-2 rounded-2xl bg-blue-600 text-white font-extrabold text-sm hover:opacity-90 transition">
                    ترجمة الآيات
                  </button>
                </div>

                <div id="versePanel" aria-hidden="true"
                  class="mt-4 rounded-3xl border border-slate-900/10 bg-white/55 p-4" style="max-height:0; overflow:hidden; opacity:0; transform: translateY(-4px);
                     transition:max-height .45s ease, opacity .35s ease, transform .35s ease;">
                  <div id="ayahContext" class="text-[18px] leading-[2.2]"
                    style="transition: opacity 0.2s ease, transform 0.2s ease;"></div>
                </div>
              </div>
              </div>
              </div><!-- /tafsirPages crossfade stage -->
            </div>
          </div>
        </div>


      </div>
    </section>

    <!-- AI (collapsed) -->
    <section class="pb-10">
      <div class="mx-auto max-w-2xl text-center">
        <button type="button" id="aiToggleBtn" aria-expanded="false" aria-disabled="true" disabled
          class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/70 border border-slate-900/10 transition font-extrabold text-sm text-slate-800 subtle cursor-not-allowed opacity-60">
          سؤال الذكاء الاصطناعي - قريبًا
          <span id="aiChevron" class="transition-transform">⌄</span>
        </button>

        <div id="aiPanel" data-open="0" class="mt-4">
          <div class="mt-8 mx-auto max-w-2xl glass rounded-3xl p-3">
            <div class="relative">
              <textarea id="aiQuestion" rows="1"
                class="input-glass w-full resize-none bg-transparent outline-none px-6 py-4 text-slate-900 placeholder:text-slate-400 text-base leading-6"
                placeholder="Ask a Quranic question... (Ctrl+Enter)"></textarea>
            </div>

            <div
              class="mt-3 flex flex-col sm:flex-row items-center justify-center gap-3 flex-wrap px-2 pb-1 text-center">
              <div class="flex gap-2 flex-wrap justify-center w-full">
                <button type="button"
                  class="px-3 py-1.5 rounded-full text-xs font-bold bg-slate-900/5 hover:bg-slate-900/10 transition"
                  data-ai-prompt="ما معنى الصبر في القرآن؟">الصبر</button>
                <button type="button"
                  class="px-3 py-1.5 rounded-full text-xs font-bold bg-slate-900/5 hover:bg-slate-900/10 transition"
                  data-ai-prompt="هل الصدقة واجبة؟">الصدقة</button>
                <button type="button"
                  class="px-3 py-1.5 rounded-full text-xs font-bold bg-slate-900/5 hover:bg-slate-900/10 transition"
                  data-ai-prompt="ما آيات التوكل على الله؟">التوكل</button>
              </div>

              <div class="flex gap-2 w-full justify-center">
                <button type="button" id="aiAskBtn"
                  class="px-4 py-2 rounded-2xl font-extrabold text-sm bg-slate-900 text-white hover:opacity-90 transition subtle">
                  ابحث
                </button>
                <button type="button" id="aiClearBtn"
                  class="px-4 py-2 rounded-2xl font-extrabold text-sm bg-white/60 border border-slate-900/10 hover:bg-white transition">
                  مسح
                </button>
              </div>
            </div>

            <div id="aiStatus" class="mt-2 text-xs font-bold text-slate-500 text-center px-2" aria-live="polite"></div>
          </div>
          <div id="aiResults" class="mt-8 mx-auto max-w-3xl"></div>
        </div>
      </div>
    </section>
    <!-- Tafsir + Context (shows after selecting an ayah) -->

  </main>

  <script>
    // Make the AI question textarea behave like a single-line field (auto grow to 3 lines max)
    (function () {
      const t = document.getElementById("aiQuestion");
      if (!t) return;
      const resize = () => {
        t.style.height = "auto";
        const max = 3 * 24; // approx
        t.style.height = Math.min(t.scrollHeight, max) + "px";
      };
      t.addEventListener("input", resize);
      resize();
    })();
    (function () {
      const btn = document.getElementById("aiToggleBtn");
      const panel = document.getElementById("aiPanel");
      const chevron = document.getElementById("aiChevron");
      if (!btn || !panel) return;
      const setOpen = (open) => {
        panel.dataset.open = open ? "1" : "0";
        panel.classList.toggle("is-open", !!open);
        btn.setAttribute("aria-expanded", open ? "true" : "false");
        if (chevron) chevron.style.transform = open ? "rotate(180deg)" : "rotate(0deg)";
      };
      setOpen(panel.dataset.open === "1" || panel.classList.contains("is-open"));
      btn.addEventListener("click", () => {
        const isOpen = panel.dataset.open === "1";
        setOpen(!isOpen);
      });
    })();
  </script>

  <!-- cache bust -->
  <script type="module" src="/src/app.js"></script>
</body>

</html>
