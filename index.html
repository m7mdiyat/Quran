  <script>
    (function () {
      try {
        if (localStorage.getItem("darkMode") === "1") {
          document.documentElement.classList.add("dark");
        }
      } catch { }
    })();
    // Detect Capacitor (Android app) context synchronously so safe-area CSS
    // gated to html.is-app applies before first paint, AND so viewport-fit=cover
    // is only set inside the app (web layout — including iOS Safari with a
    // notch — must remain visually unchanged).
    //
    // window.Capacitor is injected by the native bridge AFTER scripts evaluate,
    // so we fall back to the URL: the Capacitor WebView serves from
    // capacitor://localhost or https://localhost (NO port) and the user agent
    // contains "Android". The Vite dev server also uses http://localhost but
    // with an explicit port (5173/5174/…), so the port check excludes it; the
    // production site origin is m7mdiyat.com, which never matches. Mirrors
    // isApp() in src/app.js so the inline-script gate stays consistent with
    // the runtime gate.
    (function () {
      try {
        var loc = window.location;
        var inApp = (typeof window.Capacitor !== "undefined")
          || (loc.protocol === "capacitor:")
          || (loc.hostname === "localhost"
              && loc.port === ""
              && navigator.userAgent.indexOf("Android") !== -1);
        if (!inApp) return;
        document.documentElement.classList.add("is-app");
        var meta = document.querySelector('meta[name="viewport"]');
        var content = meta && meta.getAttribute("content") || "";
        if (meta && !/viewport-fit/.test(content)) {
          meta.setAttribute("content", content + ",viewport-fit=cover");
        }
        // Apply previously-measured Android status-bar height (set by JS
        // via StatusBar.getInfo() on a previous launch) so the very first
        // paint already pads correctly — no layout shift when the async
        // re-measurement finishes. First-ever launch still falls back to
        // the CSS 24px floor for one frame, then jumps to the real value.
        try {
          var cached = localStorage.getItem("m7_statusbar_h");
          if (cached && Number(cached) > 0) {
            document.documentElement.style.setProperty("--m7-statusbar-height", cached + "px");
          }
        } catch {}
      } catch { }
    })();
  </script>

  <script>
    (function () {
      try {
        var url = new URL(window.location.href);
        var params = new URLSearchParams(url.search);
        var cleanOrigin = "https://www.m7mdiyat.com";
        var surah = null, ayah = null;

        // Pattern 1: New clean URL format /surah/ayah
        var pathMatch = url.pathname.match(/^\/([0-9]+)\/([0-9]+)\/?$/);
        if (pathMatch) {
          surah = pathMatch[1];
          ayah = pathMatch[2];
        }

        // Pattern 1b: Mushaf reading-mode routes (direct or via 404.html →
        // sessionStorage handoff on GitHub Pages). We don't change layout
        // here — mushaf.js opens the panel inline once app.js init runs.
        // We only set window._mushafInit so init() knows what to open.
        var mushafPath = url.pathname;
        try {
          var redirected = sessionStorage.getItem('mushaf_redirect');
          if (redirected) {
            sessionStorage.removeItem('mushaf_redirect');
            mushafPath = redirected;
            history.replaceState(null, "", mushafPath);
          }
        } catch {}

        var mushafPageMatch = mushafPath.match(/^\/read\/page\/([0-9]+)\/?$/);
        var mushafSurahMatch = mushafPath.match(/^\/read\/surah\/([0-9]+)\/?$/);
        var mushafAyahMatch = mushafPath.match(/^\/read\/ayah\/([0-9]+)\/([0-9]+)\/?$/);
        if (mushafPageMatch) window._mushafInit = { page: Number(mushafPageMatch[1]) };
        else if (mushafSurahMatch) window._mushafInit = { surah: Number(mushafSurahMatch[1]) };
        else if (mushafAyahMatch) window._mushafInit = { surah: Number(mushafAyahMatch[1]), ayah: Number(mushafAyahMatch[2]) };

        // The mode toggle's visual state must match what's about to render.
        // URL is canonical: /read/* → Mushaf, anything else → Tafsir. Setting
        // this BEFORE the modules load avoids a brief flash where the toggle
        // shows the saved preference and then snaps to the URL-driven mode.
        var bootMushaf = !!(mushafPageMatch || mushafSurahMatch || mushafAyahMatch);
        var bootMode = bootMushaf ? "mushaf" : "tafsir";
        document.documentElement.setAttribute("data-app-mode", bootMode);
        try { localStorage.setItem("app_mode", bootMode); } catch {}

        // Pattern 2: Old query format ?v=surah-ayah (redirect to new format)
        var v = params.get("v") || params.get("ayah");
        if (!surah && v) {
          var parts = v.split(/[-:\/]/);
          if (parts.length >= 2) {
            surah = parts[0];
            ayah = parts[1];
            // Redirect old URL to new clean URL
            window.location.replace("/" + surah + "/" + ayah);
            return;
          }
        }

        // Pattern 3: Check sessionStorage for 404 redirect
        var redirSurah = sessionStorage.getItem('redirect_surah');
        var redirAyah = sessionStorage.getItem('redirect_ayah');
        if (!surah && redirSurah && redirAyah) {
          surah = redirSurah;
          ayah = redirAyah;
          sessionStorage.removeItem('redirect_surah');
          sessionStorage.removeItem('redirect_ayah');
          // Store in app state for later use
          window._redirectedAyah = { surah: surah, ayah: ayah };
        }

        // Build final canonical URL
        var finalUrl = cleanOrigin + "/";
        var pageTitle = "محمديات";

        if (surah && ayah) {
          finalUrl = cleanOrigin + "/" + surah + "/" + ayah;
          pageTitle = "تفسير سورة " + surah + " آية " + ayah + " | محمديات";
        }

        // Apply to canonical (most important for SEO)
        var link = document.getElementById("canonicalLink");
        if (link) link.href = finalUrl;

        // Apply to Open Graph
        var ogUrl = document.getElementById("ogUrl");
        if (ogUrl) ogUrl.content = finalUrl;
        var ogTitle = document.getElementById("ogTitle");
        if (ogTitle) ogTitle.content = pageTitle;

        // Apply to browser tab only if not already set by prerender
        if (document.title === "محمديات") {
          document.title = pageTitle;
        }

      } catch (e) { console.error("SEO Patch Error", e); }
    })();
  </script>

    }

    header.site-header {
      background: rgba(247, 251, 255, .72);

      backdrop-filter: blur(8px);

    /* Capacitor app only: status bar / notch / cutout safe-area padding.
     * Under Android 15+ (target SDK 35+) the WebView is forced edge-to-edge
     * and overlaysWebView:true makes that consistent on older Android too,
     * so the sticky header must pad its own top + left/right insets — the
     * system no longer reserves the space. Gated to html.is-app (set by
     * the inline script above) so web layout is byte-identical.
     *
     * For the TOP inset we use max(env(...), 24px). Reason: on Android 14
     * with overlaysWebView:true the WebView genuinely renders edge-to-edge,
     * but the Android 14 WebView's window-insets propagation to the
     * renderer is unreliable — env(safe-area-inset-top) often reports 0
     * instead of the real ~30dp status-bar height. With a 0-padding header,
     * the buttons render BEHIND the status bar overlay (the "top eaten up"
     * symptom on Pixel 8). 24px is the Android default status-bar height,
     * so max() guarantees at least that much padding even when env() lies.
     * Android 15+ propagates correctly (env returns ~30+) → max picks env,
     * unchanged behavior. */
    html.is-app header.site-header {
      padding-top: max(env(safe-area-inset-top, 0px), var(--m7-statusbar-height, 24px));
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }

    .theme-toggle {
      /* White button in light mode */
      background: linear-gradient(135deg, #ffffff, #f8fafc);
      border-color: rgba(15, 23, 42, .12);
      color: #334155;
      letter-spacing: .3px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Hover styles are the visual INVERSE of the normal styles (dark in
     * light mode, light in dark mode). On touch devices :hover sticks
     * after a tap until the next touch elsewhere, so the post-tap button
     * froze in this inverse state — looking exactly like the previous
     * mode and creating the "one tap behind" perception. Gating hover
     * to @media (hover: hover) ensures only true pointer devices (mouse,
     * trackpad) get hover effects; touch never sticks. Same pattern is
     * used elsewhere in public/styles.css:879-907. */
    @media (hover: hover) {
      .theme-toggle:hover {
        /* Dark on hover in light mode */
        background: linear-gradient(135deg, #1e293b, #334155);
        border-color: rgba(15, 23, 42, .2);
        color: #f1f5f9;
        transform: translateY(-1px);
      }
    }

    body.dark .theme-toggle {
      /* Dark button matching page background in dark mode */
      background: linear-gradient(135deg, #232933, #1f252e) !important;
      border-color: rgba(148, 163, 184, .2) !important;
      color: #e2e8f0 !important;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    @media (hover: hover) {
      body.dark .theme-toggle:hover {
        /* Light on hover in dark mode */
        background: linear-gradient(135deg, #ffffff, #f1f5f9) !important;
        border-color: rgba(148, 163, 184, .3) !important;
        color: #1e293b !important;
        transform: translateY(-1px);
      }
    }

    /* Older / smaller phones (~ ≤ 400 CSS px wide — iPhone SE, older Androids,

    /* Browser autofill (saved-search dropdown) paints the input white from
     * outside CSS — defeat it by overriding with a giant inset box-shadow,
     * the only property that beats -webkit-autofill's background.
     *
     * Notes:
     * - Opaque inset (no rgba alpha) so the browser's frozen autofill
     *   background-color cannot bleed through during a theme toggle.
     * - transition: none kills the Tailwind 150ms easing on this state
     *   so theme toggles swap colors instantly — no laggy fade where
     *   the inset is mid-transition while the underlying background
     *   sits in the old theme. */
    .input-glass:-webkit-autofill,
    .input-glass:-webkit-autofill:hover,
    .input-glass:-webkit-autofill:focus,
    .input-glass:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 1000px #f1f5f9 inset !important;
      -webkit-text-fill-color: #0f172a !important;
      caret-color: #0f172a !important;
      transition: none !important;
    }

    body.dark .input-glass:-webkit-autofill:focus,

    /* ============================================================
     * Tafsir toolbar dropdowns — nuclear stacking + opacity fix
     *
     * Root cause: .mushaf-toolbar__dropdown has opacity:0→1 (animated),
     * backdrop-filter:blur, and rgba(--card) background. The parent
     * #tafsirSection (.glass) ALSO has backdrop-filter. Sibling #tafsirBox /
     * #tafsirAyahTag spawn transient stacking contexts (transform + opacity
     * animations). The combination made the dropdown panel partially
     * transparent — tafsir text visibly bled through.
     *
     * Applied with !important and at every viewport so nothing inherited
     * from the base mushaf-toolbar__dropdown rule can overpower it:
     *  - Solid bg color (no rgba, no var, no gradient).
     *  - backdrop-filter completely off.
     *  - Open state uses visibility, not opacity, so there's no mid-fade
     *    semi-transparent frame.
     *  - z-index 99999 on dropdowns + their wraps so they win against
     *    every sibling stacking context.
     *  - isolation:isolate on each dropdown so the panel always composites
     *    as its own group regardless of parent backdrop-filter quirks.
     * ============================================================ */

    #tafsirVolDropdown,
    #tafsirSettingsWrap > [data-tafsir-settings-dropdown] {
      background-color: #ffffff !important;
      background-image: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      opacity: 1 !important;
      z-index: 99999 !important;
      isolation: isolate !important;
      transition: transform 180ms ease !important;
    }

    html.dark #tafsirVolDropdown,
    body.dark #tafsirVolDropdown,
    html.dark #tafsirSettingsWrap > [data-tafsir-settings-dropdown],
    body.dark #tafsirSettingsWrap > [data-tafsir-settings-dropdown] {
      background-color: #1e293b !important;
    }

    /* Closed state via visibility — no opacity fade that could ever
       expose content behind the panel for even a frame. */
    #tafsirVolDropdown:not(.mushaf-toolbar__dropdown--open),
    #tafsirSettingsWrap > [data-tafsir-settings-dropdown]:not(.mushaf-toolbar__dropdown--open) {
      visibility: hidden !important;
      pointer-events: none !important;
    }

    #tafsirVolDropdown.mushaf-toolbar__dropdown--open,
    #tafsirSettingsWrap > [data-tafsir-settings-dropdown].mushaf-toolbar__dropdown--open {
      visibility: visible !important;
      pointer-events: auto !important;
    }

    /* Wraps + the whole toolbar row need to be above the tafsir content
       row beneath them — because tafsir-top-row and the mt-6 (compare panel /
       ayah nav / tafsir box) are siblings with z-index:auto, the later
       (mt-6) paints on top of the earlier (top-row) by document order.
       Lift the row out of that order. */
    #tafsirPlayWrap,
    #tafsirSettingsWrap {
      z-index: 99999 !important;
    }

    #tafsirSection .tafsir-top-row {
      position: relative;
      z-index: 50;
    }

    .compare-scroll {
      max-height: 60vh;
      overflow: auto;
      scrollbar-gutter: stable;
    }

    #tafsirComparePanel.is-expanded .compare-scroll {
      max-height: none;
      overflow: visible;
    }

    #tafsirCompareContent {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .24s ease, transform .24s ease;
    }

    /* Tafsir title + info button. The description is now a click-to-open
       popover anchored to this row instead of always-visible text. */
    .tafsir-title-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tafsir-desc-btn {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      padding: 0;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--muted, #64748b);
      cursor: pointer;
      flex-shrink: 0;
      transition: color .15s ease, background .15s ease;
    }

    .tafsir-desc-btn:hover,
    .tafsir-desc-btn[aria-expanded="true"] {
      color: var(--accent-strong, #0b6bdc);
      background: rgba(148, 163, 184, 0.14);
    }

    .tafsir-desc-btn svg {
      width: 16px;
      height: 16px;
    }

    #tafsirDesc.tafsir-desc-pop {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 50;
      max-width: min(280px, 78vw);
      width: max-content;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--card, #ffffff);
      border: 1px solid var(--line, rgba(15, 23, 42, 0.1));
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.14);
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1.6;
      color: var(--muted, #64748b);
      text-align: right;
      white-space: normal;
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
    }

    #tafsirDesc.tafsir-desc-pop.is-open {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    .fade-in.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ====================================================================
     * Offline downloads panel (APP ONLY — button revealed by JS via isApp())
     * ==================================================================== */

    /* App-only header actions cluster (offline + feedback buttons). Empty on
       the website — both children start display:none and are revealed by their
       respective panel modules behind isApp(). */
    .header-app-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .offline-menu-btn,
    .feedback-menu-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ffffff, #f8fafc);
      border: 1px solid rgba(15, 23, 42, .12);
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
      color: #334155;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    /* Hover styles are the visual INVERSE of the normal styles (dark in
     * light mode, light in dark mode). On touch devices :hover sticks
     * after a tap until the next touch elsewhere, so the post-tap button
     * froze in this inverse state — looking like a "selected in opposite
     * theme color" highlight. Gating hover to @media (hover: hover) ensures
     * only true pointer devices (mouse, trackpad) get hover effects; touch
     * never sticks. Same pattern as .theme-toggle:hover above.
     * Covers all three header buttons — #notesMenuBtn reuses .offline-menu-btn. */
    @media (hover: hover) {
      .offline-menu-btn:hover,
      .feedback-menu-btn:hover {
        background: linear-gradient(135deg, #1e293b, #334155);
        border-color: rgba(15, 23, 42, .2);
        color: #f1f5f9;
        transform: translateY(-1px);
      }
    }

    body.dark .offline-menu-btn,
    body.dark .feedback-menu-btn {
      background: linear-gradient(135deg, #232933, #1f252e);
      border-color: rgba(148, 163, 184, .2);
      color: #e2e8f0;
    }

    @media (hover: hover) {
      body.dark .offline-menu-btn:hover,
      body.dark .feedback-menu-btn:hover {
        background: linear-gradient(135deg, #ffffff, #f1f5f9);
        border-color: rgba(148, 163, 184, .3);
        color: #1e293b;
      }
    }

    .offline-menu-btn svg,
    .feedback-menu-btn svg { width: 18px; height: 18px; }

    /* Backdrop + centered card */
    .offline-sheet {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
      direction: rtl;
    }

    .offline-sheet--open { display: flex; }

    .offline-sheet__backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, .42);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      animation: offline-sheet-fade 180ms ease forwards;
    }

    .offline-sheet__card {
      position: relative;
      width: min(440px, 100%);
      max-height: calc(100vh - 32px);
      overflow: auto;
      background: rgba(247, 251, 255, .96);
      border: 1px solid rgba(15, 23, 42, .08);
      border-radius: 22px;
      padding: 22px 22px 18px;
      box-shadow: 0 30px 80px rgba(15, 23, 42, .22);
      animation: offline-sheet-pop 220ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    body.dark .offline-sheet__card {
      background: rgba(35, 41, 51, .98);
      border-color: rgba(148, 163, 184, .18);
      color: #e2e8f0;
    }

    @keyframes offline-sheet-fade { from { opacity: 0 } to { opacity: 1 } }
    @keyframes offline-sheet-pop {
      from { opacity: 0; transform: translateY(8px) scale(.98) }
      to { opacity: 1; transform: translateY(0) scale(1) }
    }

    .offline-sheet__close {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: none;
      background: rgba(15, 23, 42, .06);
      color: #475569;
      cursor: pointer;
      transition: background .15s ease;
    }

    .offline-sheet__close:hover { background: rgba(15, 23, 42, .12); }
    .offline-sheet__close svg { width: 16px; height: 16px; }

    body.dark .offline-sheet__close {
      background: rgba(148, 163, 184, .14);
      color: #cbd5e1;
    }

    body.dark .offline-sheet__close:hover { background: rgba(148, 163, 184, .24); }

    .offline-sheet__head { text-align: center; margin-bottom: 18px; padding-top: 4px; }

    .offline-sheet__icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 10px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(29, 143, 255, .15), rgba(29, 143, 255, .05));
      color: #1d8fff;
    }

    .offline-sheet__icon svg { width: 28px; height: 28px; }

    .offline-sheet__title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--text, #0b1326);
    }

    .offline-sheet__desc {
      margin: 6px 0 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted, #64748b);
      line-height: 1.7;
    }

    .offline-sheet__rows { display: flex; flex-direction: column; gap: 12px; }

    .offline-row {
      background: rgba(255, 255, 255, .7);
      border: 1px solid rgba(15, 23, 42, .08);
      border-radius: 16px;
      padding: 14px 14px 14px;
    }

    body.dark .offline-row {
      background: rgba(255, 255, 255, .03);
      border-color: rgba(148, 163, 184, .16);
    }

    .offline-row__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .offline-row__title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text, #0b1326);
    }

    .offline-row__size {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted, #64748b);
      background: rgba(15, 23, 42, .05);
      padding: 3px 8px;
      border-radius: 999px;
    }

    body.dark .offline-row__size { background: rgba(148, 163, 184, .14); }

    .offline-row__desc {
      font-size: 12.5px;
      color: var(--muted, #64748b);
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .offline-row__status { min-height: 38px; }

    /* States */
    .offline-row__progress { display: flex; flex-direction: column; gap: 8px; }
    .offline-row__progress .mushaf-download__bar { margin: 0; }
    .offline-row__progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
    }
    .offline-row__progress-msg {
      color: var(--text, #0b1326);
      font-weight: 600;
      line-height: 1.5;
      min-height: 1.5em;
      transition: opacity .25s ease;
    }
    .offline-row__progress-pct {
      color: var(--muted, #64748b);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: .03em;
    }

    .offline-row__pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      width: 100%;
      box-sizing: border-box;
      justify-content: flex-start;
    }
    .offline-row__pill svg { width: 16px; height: 16px; flex-shrink: 0; }
    .offline-row__pill--warn {
      background: rgba(245, 158, 11, .12);
      color: #b45309;
    }
    body.dark .offline-row__pill--warn { background: rgba(245, 158, 11, .14); color: #fbbf24; }
    .offline-row__pill--err {
      background: rgba(239, 68, 68, .12);
      color: #b91c1c;
      justify-content: space-between;
    }
    body.dark .offline-row__pill--err { background: rgba(239, 68, 68, .14); color: #fca5a5; }

    .offline-row__done {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .offline-row__badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(16, 185, 129, .14);
      color: #047857;
      font-size: 12.5px;
      font-weight: 700;
    }
    body.dark .offline-row__badge { background: rgba(16, 185, 129, .16); color: #6ee7b7; }
    .offline-row__badge svg { width: 14px; height: 14px; }

    .offline-row__done-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .offline-row__confirm {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(245, 158, 11, .08);
      border: 1px solid rgba(245, 158, 11, .25);
    }
    body.dark .offline-row__confirm { background: rgba(245, 158, 11, .1); border-color: rgba(245, 158, 11, .3); }
    .offline-row__confirm-text {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text, #0b1326);
      line-height: 1.6;
    }
    .offline-row__confirm-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-start;
    }

    /* Buttons */
    .offline-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
    }
    .offline-btn svg { width: 15px; height: 15px; }

    .offline-btn--primary {
      width: 100%;
      background: linear-gradient(135deg, #1d8fff, #1976d2);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(29, 143, 255, .26);
    }
    .offline-btn--primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(29, 143, 255, .32);
    }

    .offline-btn--ghost {
      background: rgba(15, 23, 42, .05);
      color: var(--text, #0b1326);
    }
    .offline-btn--ghost:hover { background: rgba(15, 23, 42, .1); }
    body.dark .offline-btn--ghost {
      background: rgba(148, 163, 184, .12);
      color: #e2e8f0;
    }
    body.dark .offline-btn--ghost:hover { background: rgba(148, 163, 184, .2); }

    .offline-btn--danger {
      background: rgba(239, 68, 68, .15);
      color: #b91c1c;
    }
    .offline-btn--danger:hover { background: rgba(239, 68, 68, .22); }
    body.dark .offline-btn--danger { background: rgba(239, 68, 68, .2); color: #fecaca; }
    body.dark .offline-btn--danger:hover { background: rgba(239, 68, 68, .28); }

    .offline-btn--danger-text { color: #b91c1c; }
    body.dark .offline-btn--danger-text { color: #fecaca; }

    /* ---------- Feedback section (app-only, inside offline sheet) ---------- */
    .feedback-section {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid rgba(15, 23, 42, .08);
    }
    body.dark .feedback-section { border-top-color: rgba(148, 163, 184, .18); }

    .feedback-section__head { margin-bottom: 12px; }
    .feedback-section__title {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text, #0b1326);
      font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
    }
    body.dark .feedback-section__title { color: #e2e8f0; }
    .feedback-section__desc {
      margin: 0;
      font-size: 13px;
      color: #64748b;
      line-height: 1.55;
    }
    body.dark .feedback-section__desc { color: #94a3b8; }

    .feedback-form { display: flex; flex-direction: column; gap: 10px; margin: 0; }
    .feedback-field { display: flex; flex-direction: column; gap: 6px; position: relative; }
    .feedback-label {
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
    }
    body.dark .feedback-label { color: #cbd5e1; }
    .feedback-optional { color: #94a3b8; font-weight: 500; }
    body.dark .feedback-optional { color: #64748b; }

    .feedback-input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(15, 23, 42, .12);
      background: #ffffff;
      color: var(--text, #0b1326);
      font-size: 14px;
      font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
      outline: none;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }
    .feedback-input:focus {
      border-color: #1d8fff;
      box-shadow: 0 0 0 3px rgba(29, 143, 255, .15);
    }
    body.dark .feedback-input {
      background: rgba(15, 23, 42, .35);
      color: #e2e8f0;
      border-color: rgba(148, 163, 184, .25);
    }
    body.dark .feedback-input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, .2);
    }

    .feedback-textarea {
      resize: vertical;
      min-height: 88px;
      max-height: 220px;
      line-height: 1.55;
    }

    .feedback-counter {
      align-self: flex-start;
      font-size: 11px;
      color: #94a3b8;
      font-variant-numeric: tabular-nums;
    }
    body.dark .feedback-counter { color: #64748b; }

    .feedback-honeypot {
      position: absolute;
      left: -9999px;
      top: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .feedback-submit { margin-top: 4px; }
    .feedback-submit:disabled { opacity: .65; cursor: default; transform: none; box-shadow: 0 4px 10px rgba(29, 143, 255, .18); }

    .feedback-status {
      min-height: 0;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      padding: 0;
      border-radius: 12px;
      transition: padding 120ms ease;
    }
    .feedback-status:empty { display: none; }
    .feedback-status--info { padding: 8px 10px; background: rgba(29, 143, 255, .08); color: #1976d2; }
    .feedback-status--ok { padding: 8px 10px; background: rgba(34, 197, 94, .12); color: #15803d; }
    .feedback-status--err { padding: 8px 10px; background: rgba(239, 68, 68, .12); color: #b91c1c; }
    body.dark .feedback-status--info { background: rgba(96, 165, 250, .14); color: #bfdbfe; }
    body.dark .feedback-status--ok { background: rgba(34, 197, 94, .18); color: #bbf7d0; }
    body.dark .feedback-status--err { background: rgba(239, 68, 68, .2); color: #fecaca; }

    /* --- Notes editor (sheet contents) --- */
    .notes-editor { display: flex; flex-direction: column; gap: 10px; }
    .notes-editor__ayah {
      font-family: 'Tajawal', 'IBM Plex Sans Arabic', system-ui, sans-serif;
      font-size: 14px; color: #475569; background: rgba(15, 23, 42, .04);
      padding: 10px 12px; border-radius: 12px; line-height: 1.7;
      max-height: 78px; overflow: auto; text-align: justify;
    }
    body.dark .notes-editor__ayah { background: rgba(148, 163, 184, .1); color: #cbd5e1; }
    .notes-editor__textarea { min-height: 110px; max-height: 240px; }
    .notes-editor__counter {
      align-self: flex-start; font-size: 11px; color: #94a3b8;
      font-variant-numeric: tabular-nums;
    }
    body.dark .notes-editor__counter { color: #64748b; }
    .notes-editor__actions {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px;
      justify-content: flex-end;
    }
    .notes-editor__actions .offline-btn { min-width: 90px; }
    .notes-editor__hint {
      font-size: 11.5px; color: #94a3b8; text-align: center; margin-top: 6px;
    }
    body.dark .notes-editor__hint { color: #64748b; }

    /* --- Notes list (sheet contents) --- */
    .notes-list { display: flex; flex-direction: column; gap: 10px; max-height: 56vh; overflow-y: auto; padding-inline-end: 2px; }
    .notes-list__row {
      background: rgba(15, 23, 42, .04); border: 1px solid rgba(15, 23, 42, .06);
      border-radius: 14px; padding: 12px; cursor: pointer;
      transition: background 120ms ease, transform 120ms ease;
    }
    .notes-list__row:hover { background: rgba(29, 143, 255, .08); }
    body.dark .notes-list__row {
      background: rgba(148, 163, 184, .08); border-color: rgba(148, 163, 184, .14);
    }
    body.dark .notes-list__row:hover { background: rgba(96, 165, 250, .15); }
    .notes-list__row-head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; margin-bottom: 6px;
    }
    .notes-list__row-ref { font-weight: 800; font-size: 13.5px; color: #0f172a; }
    body.dark .notes-list__row-ref { color: #e2e8f0; }
    .notes-list__row-time { font-size: 11px; color: #94a3b8; }
    .notes-list__row-preview {
      font-size: 13px; color: #475569; line-height: 1.55;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    body.dark .notes-list__row-preview { color: #cbd5e1; }
    .notes-list__row-actions {
      display: flex; gap: 6px; margin-top: 8px; justify-content: flex-end;
    }
    .notes-list__row-actions .offline-btn { padding: 4px 10px; font-size: 12px; min-width: 60px; }
    .notes-list__empty {
      text-align: center; color: #94a3b8; font-size: 13.5px; font-weight: 600;
      padding: 28px 8px; line-height: 1.7;
    }
    body.dark .notes-list__empty { color: #64748b; }
    .notes-list__hint {
      font-size: 11.5px; color: #94a3b8; text-align: center; margin-top: 8px;
    }
    body.dark .notes-list__hint { color: #64748b; }

    /* --- First-launch offline tooltip (neutral grey, not blue) --- */
    .m7-tip {
      position: fixed;
      z-index: 1100;
      transform: translateX(-50%) translateY(-6px);
      background: #f8fafc;
      color: #334155;
      border-radius: 12px;
      padding: 8px 12px 8px 10px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.14), 0 1px 4px rgba(15, 23, 42, 0.05);
      border: 1px solid rgba(15, 23, 42, 0.08);
      display: flex; align-items: center; gap: 8px;
      font-family: 'Tajawal', 'IBM Plex Sans Arabic', system-ui, sans-serif;
      font-size: 13px; font-weight: 600; line-height: 1.2;
      opacity: 0;
      transition: opacity 220ms ease, transform 220ms ease;
      pointer-events: auto;
      max-width: calc(100vw - 16px);
    }
    .m7-tip--show { opacity: 1; transform: translateX(-50%) translateY(0); }
    body.dark .m7-tip {
      background: #1e293b;
      color: #cbd5e1;
      border-color: rgba(148, 163, 184, 0.16);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4), 0 1px 4px rgba(0, 0, 0, 0.18);
    }
    .m7-tip__text { color: #334155; font-weight: 600; white-space: nowrap; }
    body.dark .m7-tip__text { color: #cbd5e1; }
    .m7-tip__arrow {
      position: absolute;
      top: -5px;
      left: 50%;                                       /* JS may override per-position */
      transform: translateX(-50%) rotate(45deg);
      width: 10px; height: 10px;
      background: #f8fafc;
      border-top: 1px solid rgba(15, 23, 42, 0.08);
      border-left: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 2px;
    }

            </div>

            <div
              class="mt-3 flex flex-col sm:flex-row items-center justify-center gap-3 flex-wrap px-2 pb-1 text-center">
              <div class="flex gap-2 flex-wrap justify-center w-full">
                <button type="button"
                  class="px-3 py-1.5 rounded-full text-xs font-bold bg-slate-900/5 hover:bg-slate-900/10 transition"
                  data-ai-prompt="ما معنى الصبر في القرآن؟">الصبر</button>
                <button type="button"
                  class="px-3 py-1.5 rounded-full text-xs font-bold bg-slate-900/5 hover:bg-slate-900/10 transition"
                  data-ai-prompt="هل الصدقة واجبة؟">الصدقة</button>
                <button type="button"
                  class="px-3 py-1.5 rounded-full text-xs font-bold bg-slate-900/5 hover:bg-slate-900/10 transition"
                  data-ai-prompt="ما آيات التوكل على الله؟">التوكل</button>
              </div>

              <div class="flex gap-2 w-full justify-center">
                <button type="button" id="aiAskBtn"
                  class="px-4 py-2 rounded-2xl font-extrabold text-sm bg-slate-900 text-white hover:opacity-90 transition subtle">
                  ابحث
                </button>
                <button type="button" id="aiClearBtn"
                  class="px-4 py-2 rounded-2xl font-extrabold text-sm bg-white/60 border border-slate-900/10 hover:bg-white transition">
                  مسح
                </button>
              </div>
            </div>

            <div id="aiStatus" class="mt-2 text-xs font-bold text-slate-500 text-center px-2" aria-live="polite"></div>
          </div>
          <div id="aiResults" class="mt-8 mx-auto max-w-3xl"></div>
        </div>
      </div>
    </section>
    <!-- Tafsir + Context (shows after selecting an ayah) -->

  </main>

  <script>
    // Make the AI question textarea behave like a single-line field (auto grow to 3 lines max)
    (function () {
      const t = document.getElementById("aiQuestion");
      if (!t) return;
      const resize = () => {
        t.style.height = "auto";
        const max = 3 * 24; // approx
        t.style.height = Math.min(t.scrollHeight, max) + "px";
      };
      t.addEventListener("input", resize);
      resize();
    })();
    (function () {
      const btn = document.getElementById("aiToggleBtn");
      const panel = document.getElementById("aiPanel");
      const chevron = document.getElementById("aiChevron");
      if (!btn || !panel) return;
      const setOpen = (open) => {
        panel.dataset.open = open ? "1" : "0";
        panel.classList.toggle("is-open", !!open);
        btn.setAttribute("aria-expanded", open ? "true" : "false");
        if (chevron) chevron.style.transform = open ? "rotate(180deg)" : "rotate(0deg)";
      };
      setOpen(panel.dataset.open === "1" || panel.classList.contains("is-open"));
      btn.addEventListener("click", () => {
        const isOpen = panel.dataset.open === "1";
        setOpen(!isOpen);
      });
    })();
  </script>

  <!-- cache bust -->
  <script type="module" src="/src/app.js"></script>
</body>
